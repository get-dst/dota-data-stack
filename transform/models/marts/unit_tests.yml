          - {league_id: 5, match_id: 52, started_at: '2026-03-01 10:00:00+00', series_id: 500, series_type: 1, team_id: 12, opponent_team_id: 11, is_win: false}
      - input: ref('fact_match')
        rows:
          - {match_id: 52, started_at: '2026-03-01 10:00:00+00'}
      - input: ref('dim_league')
        rows:
