version: 2

# Unit tests pin the derivations a reader has to take on trust: the position a player is
# given, the line between a won, drawn and lost lane, and which series is a league's
# final. Each runs on fixed rows, so a change to the rule fails here before it reaches
# the warehouse.

unit_tests:
  - name: position_from_lane_and_farm
    description: Mid is 2; of two safe-laners the richer is 1 and the poorer 5; of two
      offlaners the richer is 3 and the poorer 4; jungle and unparsed lanes get no position.
      Laners on the same gold per minute are split by last hits, then by player slot.
    model: fact_player_match
    given:
      - input: ref('stg_match_players')
        rows:
          - {match_id: 1, player_slot: 0, is_radiant: true, lane_role: 1, gold_per_min: 600}
          - {match_id: 1, player_slot: 1, is_radiant: true, lane_role: 1, gold_per_min: 300}
          - {match_id: 1, player_slot: 2, is_radiant: true, lane_role: 2, gold_per_min: 550}
          - {match_id: 1, player_slot: 3, is_radiant: true, lane_role: 3, gold_per_min: 450}
          - {match_id: 1, player_slot: 4, is_radiant: true, lane_role: 3, gold_per_min: 280}
          - {match_id: 1, player_slot: 128, is_radiant: false, lane_role: 4, gold_per_min: 400}
          - {match_id: 1, player_slot: 129, is_radiant: false, lane_role: null, gold_per_min: 400}
          # match 2: both lanes tied on gold per minute; last hits decide the safe lane,
          # player slot the off lane. The expected winner is listed second in one lane
          # and first in the other, so row order alone cannot pass both.
          - {match_id: 2, player_slot: 128, is_radiant: false, lane_role: 1, gold_per_min: 500, last_hits: 40}
          - {match_id: 2, player_slot: 129, is_radiant: false, lane_role: 1, gold_per_min: 500, last_hits: 90}
          - {match_id: 2, player_slot: 130, is_radiant: false, lane_role: 3, gold_per_min: 450, last_hits: 60}
          - {match_id: 2, player_slot: 131, is_radiant: false, lane_role: 3, gold_per_min: 450, last_hits: 60}
      - input: ref('fact_match')
        rows:
          - {match_id: 1, radiant_team_id: 10, dire_team_id: 20}
          - {match_id: 2, radiant_team_id: 10, dire_team_id: 20}
      - input: ref('stg_heroes')
        rows: []
      - input: ref('stg_pro_players')
        rows: []
    expect:
      rows:
        - {match_id: 1, player_slot: 0, position: 1, position_name: carry}
        - {match_id: 1, player_slot: 1, position: 5, position_name: hard support}
        - {match_id: 1, player_slot: 2, position: 2, position_name: mid}
        - {match_id: 1, player_slot: 3, position: 3, position_name: offlane}
        - {match_id: 1, player_slot: 4, position: 4, position_name: soft support}
        - {match_id: 1, player_slot: 128, position: null, position_name: null}
        - {match_id: 1, player_slot: 129, position: null, position_name: null}
        - {match_id: 2, player_slot: 128, position: 5, position_name: hard support}
        - {match_id: 2, player_slot: 129, position: 1, position_name: carry}
        - {match_id: 2, player_slot: 130, position: 3, position_name: offlane}
        - {match_id: 2, player_slot: 131, position: 4, position_name: soft support}

  - name: lane_result_band_is_400_gold
    description: A lane is won when the side's laners average more than 400 gold ahead of
      the enemy laners at minute 10, lost below -400, drawn in between; exactly 400 is a
      draw; only minute 10 counts; jungle rows get no lane result.
    model: lane_outcomes
    given:
      - input: ref('fact_player_match')
        rows:
          # match 1, bottom lane: two Radiant laners (avg 2800) against one Dire laner (2400)
          - {match_id: 1, player_slot: 0, is_radiant: true, lane: 1}
          - {match_id: 1, player_slot: 1, is_radiant: true, lane: 1}
          - {match_id: 1, player_slot: 128, is_radiant: false, lane: 1}
          # match 2, mid: 3100 against 2600
          - {match_id: 2, player_slot: 2, is_radiant: true, lane: 2}
          - {match_id: 2, player_slot: 130, is_radiant: false, lane: 2}
          # match 3, top: 2000 against 2500
          - {match_id: 3, player_slot: 3, is_radiant: true, lane: 3}
          - {match_id: 3, player_slot: 131, is_radiant: false, lane: 3}
          # match 4, mid: 2901 against 2500, one gold past the line
          - {match_id: 4, player_slot: 2, is_radiant: true, lane: 2}
          - {match_id: 4, player_slot: 130, is_radiant: false, lane: 2}
          # match 4, a jungler: no lane result
          - {match_id: 4, player_slot: 4, is_radiant: true, lane: 4}
      - input: ref('stg_player_minutes')
        rows:
          - {match_id: 1, player_slot: 0, minute: 10, gold: 3000, last_hits: 40, xp: 3000}
          - {match_id: 1, player_slot: 0, minute: 5, gold: 9999, last_hits: 99, xp: 9999}
          - {match_id: 1, player_slot: 1, minute: 10, gold: 2600, last_hits: 20, xp: 2500}
          - {match_id: 1, player_slot: 128, minute: 10, gold: 2400, last_hits: 25, xp: 2600}
          - {match_id: 2, player_slot: 2, minute: 10, gold: 3100, last_hits: 60, xp: 4000}
          - {match_id: 2, player_slot: 130, minute: 10, gold: 2600, last_hits: 45, xp: 3500}
          - {match_id: 3, player_slot: 3, minute: 10, gold: 2000, last_hits: 20, xp: 2500}
          - {match_id: 3, player_slot: 131, minute: 10, gold: 2500, last_hits: 30, xp: 3000}
          - {match_id: 4, player_slot: 2, minute: 10, gold: 2901, last_hits: 50, xp: 3800}
          - {match_id: 4, player_slot: 130, minute: 10, gold: 2500, last_hits: 40, xp: 3500}
          - {match_id: 4, player_slot: 4, minute: 10, gold: 2000, last_hits: 30, xp: 2000}
    expect:
      rows:
        - {match_id: 1, player_slot: 0, lane_gold_diff_10: 400, lane_result: drawn}
        - {match_id: 1, player_slot: 1, lane_gold_diff_10: 400, lane_result: drawn}
        - {match_id: 1, player_slot: 128, lane_gold_diff_10: -400, lane_result: drawn}
        - {match_id: 2, player_slot: 2, lane_gold_diff_10: 500, lane_result: won}
        - {match_id: 2, player_slot: 130, lane_gold_diff_10: -500, lane_result: lost}
        - {match_id: 3, player_slot: 3, lane_gold_diff_10: -500, lane_result: lost}
        - {match_id: 3, player_slot: 131, lane_gold_diff_10: 500, lane_result: won}
        - {match_id: 4, player_slot: 2, lane_gold_diff_10: 401, lane_result: won}
        - {match_id: 4, player_slot: 130, lane_gold_diff_10: -401, lane_result: lost}

  - name: league_final_is_the_last_decided_series
    description: The final is the series holding a league's last game. It names a winner
      only when it is a decided best of 3 or 5, no shorter than the series before it, its
      finalists are connected through games to more than half of the league's teams, and
      the league has had no game in the three weeks before the newest loaded match.
    model: league_results
    given:
      - input: ref('fact_team_match')
        rows:
          # league 1: two best-of-3 semifinals (3 beats 4, 1 beats 2), then 1 beats 3 2-1
          - {league_id: 1, match_id: 11, started_at: '2026-01-01 09:00:00+00', series_id: 99, series_type: 1, team_id: 3, opponent_team_id: 4, is_win: true}
          - {league_id: 1, match_id: 11, started_at: '2026-01-01 09:00:00+00', series_id: 99, series_type: 1, team_id: 4, opponent_team_id: 3, is_win: false}
          - {league_id: 1, match_id: 12, started_at: '2026-01-01 10:00:00+00', series_id: 99, series_type: 1, team_id: 3, opponent_team_id: 4, is_win: true}
          - {league_id: 1, match_id: 12, started_at: '2026-01-01 10:00:00+00', series_id: 99, series_type: 1, team_id: 4, opponent_team_id: 3, is_win: false}
          - {league_id: 1, match_id: 13, started_at: '2026-01-01 12:00:00+00', series_id: 100, series_type: 1, team_id: 1, opponent_team_id: 2, is_win: true}
          - {league_id: 1, match_id: 13, started_at: '2026-01-01 12:00:00+00', series_id: 100, series_type: 1, team_id: 2, opponent_team_id: 1, is_win: false}
          - {league_id: 1, match_id: 14, started_at: '2026-01-01 13:00:00+00', series_id: 100, series_type: 1, team_id: 1, opponent_team_id: 2, is_win: true}
          - {league_id: 1, match_id: 14, started_at: '2026-01-01 13:00:00+00', series_id: 100, series_type: 1, team_id: 2, opponent_team_id: 1, is_win: false}
          - {league_id: 1, match_id: 15, started_at: '2026-01-02 10:00:00+00', series_id: 101, series_type: 1, team_id: 1, opponent_team_id: 3, is_win: false}
          - {league_id: 1, match_id: 15, started_at: '2026-01-02 10:00:00+00', series_id: 101, series_type: 1, team_id: 3, opponent_team_id: 1, is_win: true}
          - {league_id: 1, match_id: 16, started_at: '2026-01-02 11:00:00+00', series_id: 101, series_type: 1, team_id: 1, opponent_team_id: 3, is_win: true}
          - {league_id: 1, match_id: 16, started_at: '2026-01-02 11:00:00+00', series_id: 101, series_type: 1, team_id: 3, opponent_team_id: 1, is_win: false}
          - {league_id: 1, match_id: 17, started_at: '2026-01-02 12:00:00+00', series_id: 101, series_type: 1, team_id: 1, opponent_team_id: 3, is_win: true}
          - {league_id: 1, match_id: 17, started_at: '2026-01-02 12:00:00+00', series_id: 101, series_type: 1, team_id: 3, opponent_team_id: 1, is_win: false}
          # league 2: two brackets that never meet; the last series decides one of them only
          - {league_id: 2, match_id: 21, started_at: '2026-01-01 09:00:00+00', series_id: 200, series_type: 1, team_id: 5, opponent_team_id: 6, is_win: true}
          - {league_id: 2, match_id: 21, started_at: '2026-01-01 09:00:00+00', series_id: 200, series_type: 1, team_id: 6, opponent_team_id: 5, is_win: false}
          - {league_id: 2, match_id: 22, started_at: '2026-01-01 10:00:00+00', series_id: 200, series_type: 1, team_id: 5, opponent_team_id: 6, is_win: true}
          - {league_id: 2, match_id: 22, started_at: '2026-01-01 10:00:00+00', series_id: 200, series_type: 1, team_id: 6, opponent_team_id: 5, is_win: false}
          - {league_id: 2, match_id: 23, started_at: '2026-01-02 09:00:00+00', series_id: 201, series_type: 1, team_id: 7, opponent_team_id: 8, is_win: true}
          - {league_id: 2, match_id: 23, started_at: '2026-01-02 09:00:00+00', series_id: 201, series_type: 1, team_id: 8, opponent_team_id: 7, is_win: false}
          - {league_id: 2, match_id: 24, started_at: '2026-01-02 10:00:00+00', series_id: 201, series_type: 1, team_id: 7, opponent_team_id: 8, is_win: true}
          - {league_id: 2, match_id: 24, started_at: '2026-01-02 10:00:00+00', series_id: 201, series_type: 1, team_id: 8, opponent_team_id: 7, is_win: false}
          # league 3: a best of 5 with two games in the feed
          - {league_id: 3, match_id: 31, started_at: '2026-01-02 09:00:00+00', series_id: 300, series_type: 2, team_id: 9, opponent_team_id: 10, is_win: true}
          - {league_id: 3, match_id: 31, started_at: '2026-01-02 09:00:00+00', series_id: 300, series_type: 2, team_id: 10, opponent_team_id: 9, is_win: false}
          - {league_id: 3, match_id: 32, started_at: '2026-01-02 10:00:00+00', series_id: 300, series_type: 2, team_id: 9, opponent_team_id: 10, is_win: true}
          - {league_id: 3, match_id: 32, started_at: '2026-01-02 10:00:00+00', series_id: 300, series_type: 2, team_id: 10, opponent_team_id: 9, is_win: false}
          # league 4: the last series is a best of 1
          - {league_id: 4, match_id: 41, started_at: '2026-01-01 09:00:00+00', series_id: 400, series_type: 1, team_id: 13, opponent_team_id: 14, is_win: true}
