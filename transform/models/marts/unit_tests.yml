      rows:
        - {league_id: 1, matches: 7, series: 3, teams: 4, final_best_of: 3, final_status: final, winner_team_id: 1, runner_up_team_id: 3, final_score: 2-1}
        - {league_id: 2, matches: 4, series: 2, teams: 4, final_best_of: 3, final_status: several brackets, winner_team_id: null, runner_up_team_id: null, final_score: null}
        - {league_id: 3, matches: 2, series: 1, teams: 2, final_best_of: 5, final_status: incomplete series, winner_team_id: null, runner_up_team_id: null, final_score: null}
        - {league_id: 4, matches: 3, series: 2, teams: 2, final_best_of: 1, final_status: not a final format, winner_team_id: null, runner_up_team_id: null, final_score: null}
        - {league_id: 5, matches: 2, series: 1, teams: 2, final_best_of: 3, final_status: in progress, winner_team_id: null, runner_up_team_id: null, final_score: null}
