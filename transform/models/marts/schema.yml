version: 2

models:
  - name: fact_match
    description: One row per professional Dota 2 match, winner resolved to a team.
    columns:
      - name: match_id
        tests: [unique, not_null]
      - name: started_at
        tests: [not_null]
      - name: radiant_win
        tests: [not_null]
  - name: fact_player_match
    description: One row per player per professional match (tests/ten_players_per_match.sql
      pins the grain).
    columns:
      - name: match_id
        tests: [not_null]
      - name: hero_id
        tests: [not_null]
  - name: fact_draft
    description: Picks and bans per match in draft order.
    columns:
      - name: match_id
        tests: [not_null]
  - name: daily_hero_stats
    description: Picks, bans and wins per hero per day per patch.
  - name: dim_hero
    columns:
      - name: hero_id
        tests: [unique, not_null]
  - name: dim_patch
    columns:
      - name: patch_id
        tests: [unique, not_null]
  - name: dim_team
    columns:
      - name: team_id
        tests: [unique, not_null]
  - name: dim_league
    columns:
      - name: league_id
        tests: [unique, not_null]
  - name: fact_pub_match
    description: One row per sampled public matchmaking match.
    columns:
      - name: match_id
        tests: [unique, not_null]
      - name: game_type
        tests:
          - accepted_values:
              values: [ranked_all_pick, unranked_all_pick, turbo]
  - name: fact_pub_hero
    description: One row per hero per sampled public match.
    columns:
      - name: hero_id
        tests: [not_null]
  - name: pub_hero_stats
  - name: pub_matchups
  - name: pub_duos
  - name: hero_item_builds
  - name: team_head_to_head
  - name: dim_bracket
    columns:
      - name: bracket_id
        tests: [unique, not_null]
  - name: dim_pro_player
    columns:
      - name: account_id
        tests: [unique, not_null]
  - name: hero_item_timings
  - name: league_standings
  - name: daily_pub_hero_stats
  - name: pub_hero_by_duration
  - name: dim_patch_note
