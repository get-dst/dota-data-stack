name: dota
version: "0.1.0"
profile: dota
model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  dota:
    # Descriptions from the schema.yml files land as COMMENTs on tables, views and columns.
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
