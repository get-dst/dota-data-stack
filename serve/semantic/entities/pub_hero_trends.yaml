name: pub_hero_trends
description: Hero games and wins per day over the public sample, ranked All Pick only —
  the day series behind "is this hero rising or falling".
grain: one row per hero per day
use_cases:
  - Use for a hero's win rate over time, this week versus last week.
  - Avoid for a single overall number; that is pub_hero_stats.
common_questions:
  - Is Pudge's win rate going up this week?
  - How has Invoker trended since the patch?
source:
  connection: warehouse
  table: marts.daily_pub_hero_stats
default_time_field: match_date
primary_key: [match_date, hero_id]
population: Counted over a sample of public matchmaking games, ranked All Pick only.
  Days with few sampled games swing wildly; read the game count.
fields:
  - {name: match_date, type: date}
  - {name: patch_id, type: integer}
  - {name: patch_name, type: string}
  - {name: hero_id, type: integer}
  - {name: hero_name, type: string}
  - {name: games, type: integer}
  - {name: wins, type: integer}
dimensions:
  - {name: hero_name, type: string}
  - {name: match_date, type: date}
  - {name: patch_name, type: string}
metrics:
  - {name: daily_games, agg: sum, expr: pub_hero_trends.games}
  - {name: daily_wins, agg: sum, expr: pub_hero_trends.wins}
  - name: daily_win_rate
    better: higher
    type: ratio
    numerator: daily_wins
    denominator: daily_games
    format: percent
