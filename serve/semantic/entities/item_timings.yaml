name: item_timings
description: When pros first buy an item on a hero, per patch — the typical minute, how
  many games bought it, and how many of those were won. Items costing 1 000 gold or more.
grain: one row per hero, item and patch
use_cases:
  - Use for "when do pros buy X on Y" and which items a hero rushes.
  - Avoid for what a hero ends the game holding; that is hero_item_builds.
  - Avoid for the order items are completed in (a hero's first, second or third major item); this table has no order.
common_questions:
  - When do pros buy Black King Bar on Juggernaut?
  - What does Anti-Mage rush this patch?
source:
  connection: warehouse
  table: marts.hero_item_timings
primary_key: [patch_id, hero_id, item_id]
population: First purchases in professional matches in leagues OpenDota rates premium or
  professional, in the loaded window, items of 1 000 gold or more, timed from the horn;
  pre-game purchases are excluded. Leagues it rates below professional are not counted.
fields:
  - {name: patch_id, type: integer}
  - {name: patch_name, type: string}
  - {name: hero_id, type: integer}
  - {name: hero_name, type: string}
  - {name: item_id, type: integer}
  - {name: item_name, type: string}
  - {name: item_cost, type: integer}
  - {name: games_bought, type: integer, description: Pro games in which the hero bought the item at least once.}
  - {name: wins_when_bought, type: integer}
  - {name: avg_first_bought_min, type: number, description: Average minute of the first purchase across those games.}
  - {name: earliest_bought_min, type: number}
  - {name: is_major_item, type: boolean, description: "True for a major item: at least 2000 gold, assembled or with its own active ability, not a recipe, consumable or neutral item."}
dimensions:
  - {name: hero_name, type: string, description: "The hero."}
  - {name: item_name, type: string, description: "The item."}
  - {name: patch_name, type: string, description: "Game version; group by it only to compare patches."}
metrics:
  - {name: total_games_bought, agg: sum, expr: item_timings.games_bought, description: "Pro games in which the hero bought the item at least once; the sample size beside the typical minute."}
  - {name: total_wins_when_bought, agg: sum, expr: item_timings.wins_when_bought, description: "Of the games that bought the item, those won."}
  - {name: total_bought_minutes, agg: sum, expr: "item_timings.avg_first_bought_min * item_timings.games_bought", description: "First-purchase minutes summed over the games that bought the item; divide by total_games_bought for the typical minute."}
  - name: typical_minute
    type: derived
    expr: "{total_bought_minutes} * 1.0 / NULLIF({total_games_bought}, 0)"
    description: "The minute pros typically first buy the item on the hero (the item_timing term): the average first-purchase minute over the games that bought it, weighted by games across patches. Report total_games_bought beside it."
  - name: win_rate_when_bought
    better: higher
    type: derived
    expr: "CASE WHEN {total_games_bought} >= 20 THEN {total_wins_when_bought} * 1.0 / NULLIF({total_games_bought}, 0) END"
    format: percent
    description: "Share of the games that bought the item that were won; null under 20 games (the minimum_games term)."
