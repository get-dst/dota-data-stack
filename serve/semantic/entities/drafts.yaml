name: drafts
description: Every pick and ban of every professional match, in draft order.
grain: one row per pick or ban, so a match contributes up to 24 rows
use_cases:
  - Use for ban counts, draft order, first-pick and contest questions.
  - Avoid for pick counts and win rates — a match whose draft OpenDota did not record has no
    rows here, so picks undercount; picks live on hero_daily_stats and player_performances.
common_questions:
  - Which hero was banned most this patch?
  - Which heroes are picked first most often?
source:
  connection: warehouse
  table: marts.fact_draft
default_time_field: started_at
primary_key: [match_id, draft_order]
population: Picks and bans of professional matches in leagues OpenDota rates premium or
  professional, in the loaded window. Matches whose draft OpenDota has not recorded
  contribute no rows. Leagues it rates below professional are not counted.
fields:
  - {name: match_id, type: integer}
  - {name: draft_order, type: integer, description: "Position in the draft sequence, 0-based."}
  - {name: is_pick, type: boolean}
  - {name: is_ban, type: boolean}
  - {name: hero_id, type: integer}
  - {name: hero_name, type: string}
  - {name: is_radiant, type: boolean, description: True when Radiant made this pick or ban.}
  - {name: team_id, type: integer}
  - {name: team_name, type: string}
  - {name: side_won, type: boolean, description: True when the side that made this pick or ban won the match.}
  - {name: started_at, type: timestamp}
  - {name: match_date, type: date}
  - {name: patch_id, type: integer}
  - {name: patch_name, type: string}
  - {name: league_id, type: integer}
  - {name: league_name, type: string}
dimensions:
  - {name: hero_name, type: string}
  - {name: team_name, type: string}
  - {name: patch_name, type: string}
  - {name: is_pick, type: boolean}
  - {name: match_date, type: date}
metrics:
  - {name: draft_picks, agg: sum, expr: "CASE WHEN drafts.is_pick THEN 1 ELSE 0 END", description: "Picks recorded in the draft log; fewer than the picks on player_performances when a draft is missing."}
  - {name: bans, agg: sum, expr: "CASE WHEN drafts.is_ban THEN 1 ELSE 0 END"}
  - {name: draft_actions, agg: count, expr: drafts.match_id, description: Picks plus bans.}
