name: vision_per_match
description: "One player's wards, runes and buybacks in one parsed professional match: observers and sentries placed (and before minute 10), runes taken by type, buybacks and the first one's minute."
grain: "one row per player per parsed match"
use_cases:
  - "Use for wards, runes and buybacks by team, league, date or one match."
  - "For rankings of heroes, positions or players use hero_playstyle or player_playstyle, which carry the games floor; hero_name and player_name are filters here, not groupings."
common_questions:
  - "Which team places the most observer wards per game?"
  - "Which rune type do mids take most?"
source:
  connection: warehouse
  table: marts.vision_and_runes
default_time_field: started_at
primary_key: [match_id, player_slot]
population: Players in parsed professional matches in leagues OpenDota rates premium or
  professional, in the loaded window. Leagues it rates below professional are not counted.
fields:
  - {name: match_id, type: integer}
  - {name: player_slot, type: integer, description: "0-4 Radiant, 128-132 Dire."}
  - {name: is_radiant, type: boolean}
  - {name: team_id, type: integer}
  - {name: team_name, type: string, description: "Team name as the match record carries it; null when OpenDota lists no team for the side, so a team ranking leaves the null rows out."}
  - {name: account_id, type: integer}
  - {name: player_name, type: string}
  - {name: hero_id, type: integer}
  - {name: hero_name, type: string}
  - {name: position, type: integer, description: "1 carry, 2 mid, 3 offlane, 4 soft support, 5 hard support; null for jungle, roaming or unparsed lanes."}
  - {name: position_name, type: string, description: "The position as a word: carry, mid, offlane, soft support or hard support; the filter for questions about carries, mids, offlaners or supports."}
  - {name: is_win, type: boolean}
  - {name: observers_placed, type: integer}
  - {name: sentries_placed, type: integer}
  - {name: observers_before_10, type: integer}
  - {name: sentries_before_10, type: integer}
  - {name: runes_taken, type: integer, description: "Every rune in the log, water and wisdom included; OpenDota's rune_pickups on player_performances counts bounty and power runes only."}
  - {name: bounty_runes, type: integer}
  - {name: power_runes, type: integer, description: "Double damage, haste, illusion, invisibility, regeneration, arcane and shield."}
  - {name: water_runes, type: integer}
  - {name: wisdom_runes, type: integer}
  - {name: double_damage_runes, type: integer}
  - {name: haste_runes, type: integer}
  - {name: illusion_runes, type: integer}
  - {name: invisibility_runes, type: integer}
  - {name: regeneration_runes, type: integer}
  - {name: arcane_runes, type: integer}
  - {name: shield_runes, type: integer}
  - {name: buybacks, type: integer}
  - {name: first_buyback_min, type: number, description: "Minute of the first buyback; null without one."}
  - {name: duration_min, type: number}
  - {name: started_at, type: timestamp}
  - {name: match_date, type: date}
  - {name: patch_id, type: integer}
  - {name: patch_name, type: string}
  - {name: league_id, type: integer}
  - {name: league_name, type: string}
dimensions:
  - {name: team_name, type: string}
  - {name: patch_name, type: string}
  - {name: league_name, type: string}
  - {name: position, type: integer}
  - {name: position_name, type: string}
  - {name: match_date, type: date}
metrics:
  - {name: vision_player_games, agg: count, expr: "vision_per_match.match_id", description: "Player-games (rows)."}
  - {name: matches, agg: count_distinct, expr: "vision_per_match.match_id", description: "Distinct matches in scope; a team's games, not its player-games."}
  - {name: avg_observers, agg: avg, expr: "vision_per_match.observers_placed", description: "Observer wards per player-game, for a team, league, date or match. A hero, position or player rate is hero_playstyle.observers_per_game or player_playstyle."}
  - {name: avg_sentries, agg: avg, expr: "vision_per_match.sentries_placed", description: "Sentry wards per player-game."}
  - {name: total_observers, agg: sum, expr: "vision_per_match.observers_placed"}
  - {name: total_sentries, agg: sum, expr: "vision_per_match.sentries_placed"}
  - {name: total_bounty_runes, agg: sum, expr: "vision_per_match.bounty_runes"}
  - {name: total_power_runes, agg: sum, expr: "vision_per_match.power_runes"}
  - {name: total_wisdom_runes, agg: sum, expr: "vision_per_match.wisdom_runes"}
  - {name: total_water_runes, agg: sum, expr: "vision_per_match.water_runes"}
  - {name: total_buybacks, agg: sum, expr: "vision_per_match.buybacks"}
  - {name: avg_first_buyback_min, agg: avg, expr: "vision_per_match.first_buyback_min", description: "Average minute of the first buyback, over games with one."}
  - name: observers_per_match
    type: ratio
    numerator: total_observers
    denominator: matches
    description: "Observer wards per match of the group: for a team, its five players together; for one hero or player it equals avg_observers. State the matches beside it."
  - name: sentries_per_match
    type: ratio
    numerator: total_sentries
    denominator: matches
    description: "Sentry wards per match of the group: for a team, its five players together; for one hero or player it equals avg_sentries. State the matches beside it."
  - name: power_runes_per_game
    type: ratio
    numerator: total_power_runes
    denominator: vision_player_games
    description: "Power runes taken per player-game (double damage, haste, illusion, invisibility, regeneration, arcane, shield)."
  - name: bounty_runes_per_game
    type: ratio
    numerator: total_bounty_runes
    denominator: vision_player_games
    description: "Bounty runes taken per player-game."
  - name: wisdom_runes_per_game
    type: ratio
    numerator: total_wisdom_runes
    denominator: vision_player_games
    description: "Wisdom runes taken per player-game."
