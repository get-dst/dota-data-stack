name: hero_playstyle
description: "How each hero is played in professional matches, per patch and position (1-5): teamfight participation, farm share, lane results, the space_created proxy (damage absorbed, traded deaths), wards, runes and buybacks. Heroes and positions only; a question about players or pros is player_playstyle."
grain: "one row per hero per patch per position"
use_cases:
  - "Use for rankings and comparisons of heroes or positions by how they play: which hero fights most, farms most, wins its lane, creates space, wards most."
  - "Every rate here is null under 10 games (the playstyle_minimum_games term), so a ranking lists only rows past the floor; report the games beside every rate."
  - "Group by position for 'which position …' questions; filter a hero for one hero's numbers."
  - "Avoid for named players; that is player_playstyle. Avoid for teams or single matches; those are the per-match entities (fights_per_match, farm_per_match, lanes_per_match, space_per_match, vision_per_match)."
common_questions:
  - "Which hero has the highest fight participation as a position 4?"
  - "Which carry heroes win their lane most often?"
  - "Which heroes create the most space?"
  - "What share of the team's farm does a position 1 take at 10 minutes?"
  - "Which support places the most observer wards per game?"
source:
  connection: warehouse
  table: marts.hero_playstyle
primary_key: [patch_id, hero_id, position]
population: Player-games in parsed professional matches (OpenDota's per-minute curves and
  logs) in leagues OpenDota rates premium or professional, in the loaded window, with a
  derived position. Leagues it rates below professional are not counted.
fields:
  - {name: patch_id, type: integer}
  - {name: patch_name, type: string}
  - {name: hero_id, type: integer}
  - {name: hero_name, type: string}
  - {name: position, type: integer, description: "1 carry, 2 mid, 3 offlane, 4 soft support, 5 hard support."}
  - {name: position_name, type: string, description: "The position as a word: carry, mid, offlane, soft support or hard support; the filter for questions about carries, mids, offlaners or supports."}
  - {name: games, type: integer, description: "Player-games in the row: the sample size. Rankings keep rows with games >= 10 (the playstyle_minimum_games term)."}
  - {name: wins, type: integer}
  - {name: game_minutes, type: number, description: "Minutes played, summed."}
  - {name: match_fights, type: integer, description: "Teamfights in those games."}
  - {name: fights_present, type: integer, description: "Teamfights the player was present in (damaged or healed a hero, died or got a kill inside the window)."}
  - {name: fight_kills, type: integer}
  - {name: fight_deaths, type: integer, description: "Deaths inside teamfight windows."}
  - {name: deaths_outside_fights, type: integer, description: "Deaths outside any teamfight window: pick-offs, ganks, deaths to creeps or towers."}
  - {name: fight_damage, type: integer, description: "Hero damage dealt inside teamfight windows."}
  - {name: fight_gold_delta, type: integer, description: "Gold gained over teamfight windows (passive income included)."}
  - {name: farm_games_10, type: integer, description: "Games that reached minute 10."}
  - {name: farm_share_10_total, type: number, description: "Share of the side's gold at minute 10, summed over games; divide by farm_games_10."}
  - {name: farm_games_20, type: integer, description: "Games that reached minute 20."}
  - {name: farm_share_20_total, type: number}
  - {name: last_hits_10_total, type: integer}
  - {name: lane_games, type: integer, description: "Games with a lane result (laned in a map lane against at least one enemy hero)."}
  - {name: lanes_won, type: integer}
  - {name: lanes_drawn, type: integer}
  - {name: lanes_lost, type: integer}
  - {name: avg_lane_gold_diff_10, type: number, description: "Average gold lead of the player's lane over the enemy laners at minute 10 (per-hero averages)."}
  - {name: enemy_hero_damage_taken, type: integer, description: "Damage taken from enemy heroes (space_created part 1)."}
  - {name: hero_kill_deaths, type: integer, description: "Deaths to enemy heroes."}
  - {name: trade_deaths, type: integer, description: "Deaths followed within 60 s by the side taking an enemy tower or Roshan (space_created part 2)."}
  - {name: observers_placed, type: integer}
  - {name: sentries_placed, type: integer}
  - {name: runes_taken, type: integer, description: "Every rune in the log, water and wisdom included."}
  - {name: buybacks, type: integer}
dimensions:
  - {name: hero_name, type: string, description: "The hero."}
  - {name: patch_name, type: string, description: "Game version; group by it only to compare patches."}
  - {name: position_name, type: string, description: "The position as a word: carry, mid, offlane, soft support or hard support; the filter for questions about carries, mids, offlaners or supports."}
metrics:
  - {name: games, agg: sum, expr: "hero_playstyle.games", description: "Player-games; the sample size to state beside every rate."}
  - {name: wins, agg: sum, expr: "hero_playstyle.wins", description: "Games won, a count. Win rates belong to hero_position_meta and player_performances, which cover every pro match, not only the parsed ones."}
  - {name: match_fights, agg: sum, expr: "hero_playstyle.match_fights", description: "Teamfights in the hero's games, summed."}
  - {name: fights_present, agg: sum, expr: "hero_playstyle.fights_present", description: "Teamfights the hero was present in, summed."}
  - name: fight_participation
    better: higher
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {fights_present} * 1.0 / NULLIF({match_fights}, 0) END"
    format: percent
    description: "Share of the teamfights in those games the player was present in (the fight_participation term). Per hero and position; for named players it is the player_ metric on player_playstyle."
  - {name: fight_deaths, agg: sum, expr: "hero_playstyle.fight_deaths", description: "Deaths inside teamfight windows, summed."}
  - {name: deaths_outside_fights, agg: sum, expr: "hero_playstyle.deaths_outside_fights", description: "Deaths outside any teamfight window, summed."}
  - name: fight_deaths_per_game
    better: lower
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {fight_deaths} * 1.0 / NULLIF({games}, 0) END"
    description: "Deaths inside teamfights per game. Per hero and position; for named players it is the player_ metric on player_playstyle."
  - name: deaths_outside_fights_per_game
    better: lower
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {deaths_outside_fights} * 1.0 / NULLIF({games}, 0) END"
    description: "Deaths outside teamfights (pick-offs, ganks, creeps, towers) per game. Per hero and position; for named players it is the player_ metric on player_playstyle."
  - {name: fight_gold_delta, agg: sum, expr: "hero_playstyle.fight_gold_delta", description: "Gold gained over teamfight windows, summed."}
  - name: fight_gold_per_game
    better: higher
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {fight_gold_delta} * 1.0 / NULLIF({games}, 0) END"
    description: "Gold gained over teamfight windows per game (the gold swing of fights; passive income included). Per hero and position; for named players it is the player_ metric on player_playstyle."
  - {name: farm_games_10, agg: sum, expr: "hero_playstyle.farm_games_10", description: "Games that reached minute 10."}
  - {name: farm_share_10_total, agg: sum, expr: "hero_playstyle.farm_share_10_total", description: "Share of the side's gold at minute 10, summed over games; divide by farm_games_10."}
  - name: farm_share_10
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {farm_share_10_total} * 1.0 / NULLIF({farm_games_10}, 0) END"
    format: percent
    description: "Average share of the side's gold earned at minute 10 (the farm_share term). Per hero and position; for named players it is the player_ metric on player_playstyle."
  - {name: farm_games_20, agg: sum, expr: "hero_playstyle.farm_games_20", description: "Games that reached minute 20."}
  - {name: farm_share_20_total, agg: sum, expr: "hero_playstyle.farm_share_20_total", description: "Share of the side's gold at minute 20, summed over games; divide by farm_games_20."}
  - name: farm_share_20
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {farm_share_20_total} * 1.0 / NULLIF({farm_games_20}, 0) END"
    format: percent
    description: "Average share of the side's gold earned at minute 20 (the farm_share term). Per hero and position; for named players it is the player_ metric on player_playstyle."
  - {name: last_hits_10_total, agg: sum, expr: "hero_playstyle.last_hits_10_total", description: "Last hits at minute 10, summed over games."}
  - name: last_hits_at_10
    better: higher
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {last_hits_10_total} * 1.0 / NULLIF({farm_games_10}, 0) END"
    description: "Average last hits at minute 10. Per hero and position; for named players it is the player_ metric on player_playstyle."
  - {name: lane_games, agg: sum, expr: "hero_playstyle.lane_games", description: "Games with a lane result."}
  - {name: lanes_won, agg: sum, expr: "hero_playstyle.lanes_won", description: "Lanes won at 10 minutes (the lane_outcome term)."}
  - {name: lanes_lost, agg: sum, expr: "hero_playstyle.lanes_lost", description: "Lanes lost at 10 minutes."}
  - {name: lanes_drawn, agg: sum, expr: "hero_playstyle.lanes_drawn", description: "Lanes drawn at 10 minutes, within 400 gold either way."}
  - name: lane_win_rate
    better: higher
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {lanes_won} * 1.0 / NULLIF({lane_games}, 0) END"
    format: percent
    description: "Share of lanes won at 10 minutes (the lane_outcome term). Per hero and position; for named players it is the player_ metric on player_playstyle."
  - name: lane_loss_rate
    better: lower
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {lanes_lost} * 1.0 / NULLIF({lane_games}, 0) END"
    format: percent
    description: "Share of lanes lost at 10 minutes (the lane_outcome term). Per hero and position; for named players it is the player_ metric on player_playstyle."
  - name: lane_draw_rate
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {lanes_drawn} * 1.0 / NULLIF({lane_games}, 0) END"
    format: percent
    description: "Share of lanes drawn at 10 minutes, within 400 gold either way (the lane_outcome term). Per hero and position; for named players it is the player_ metric on player_playstyle."
  - {name: enemy_hero_damage_taken, agg: sum, expr: "hero_playstyle.enemy_hero_damage_taken", description: "Damage taken from enemy heroes, summed."}
  - {name: game_minutes, agg: sum, expr: "hero_playstyle.game_minutes", description: "Minutes played, summed."}
  - name: damage_absorbed_per_min
    better: higher
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {enemy_hero_damage_taken} * 1.0 / NULLIF({game_minutes}, 0) END"
    description: "Damage taken from enemy heroes per game minute: attention absorbed, part 1 of the space_created proxy. Per hero and position; for named players it is the player_ metric on player_playstyle."
  - {name: hero_kill_deaths, agg: sum, expr: "hero_playstyle.hero_kill_deaths", description: "Deaths to enemy heroes, summed."}
  - {name: trade_deaths, agg: sum, expr: "hero_playstyle.trade_deaths", description: "Deaths the side traded for a tower or Roshan within 60 s, summed."}
  - name: trade_death_share
    better: higher
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {trade_deaths} * 1.0 / NULLIF({hero_kill_deaths}, 0) END"
    format: percent
    description: "Share of deaths to heroes that the side traded for a tower or Roshan within 60 s: part 2 of the space_created proxy. Per hero and position; for named players it is the player_ metric on player_playstyle."
  - {name: observers_placed, agg: sum, expr: "hero_playstyle.observers_placed", description: "Observer wards placed, summed."}
  - {name: sentries_placed, agg: sum, expr: "hero_playstyle.sentries_placed", description: "Sentry wards placed, summed."}
  - {name: runes_taken, agg: sum, expr: "hero_playstyle.runes_taken", description: "Runes taken, summed (every rune, water and wisdom included)."}
  - {name: buybacks, agg: sum, expr: "hero_playstyle.buybacks", description: "Buybacks, summed."}
  - name: observers_per_game
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {observers_placed} * 1.0 / NULLIF({games}, 0) END"
    description: "Observer wards placed per game. Per hero and position; for named players it is the player_ metric on player_playstyle."
  - name: sentries_per_game
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {sentries_placed} * 1.0 / NULLIF({games}, 0) END"
    description: "Sentry wards placed per game. Per hero and position; for named players it is the player_ metric on player_playstyle."
  - name: runes_per_game
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {runes_taken} * 1.0 / NULLIF({games}, 0) END"
    description: "Runes taken per game. Per hero and position; for named players it is the player_ metric on player_playstyle."
  - name: buybacks_per_game
    type: derived
    expr: "CASE WHEN {games} >= 10 THEN {buybacks} * 1.0 / NULLIF({games}, 0) END"
    description: "Buybacks per game. Per hero and position; for named players it is the player_ metric on player_playstyle."
