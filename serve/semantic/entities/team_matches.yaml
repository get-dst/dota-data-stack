name: team_matches
description: One side of one professional match, two rows per match — the team grain. A
  team's matches, wins and win rate are counted here and nowhere else; player_performances
  has five rows per side and overstates a team's matches five times.
grain: one row per team (side) per match, so counting rows counts a team's matches
use_cases:
  - Use for how many matches a team played, how many it won, its win rate, and its record over a period, a patch or a league.
  - Use for month-over-month or patch-over-patch comparisons of one team.
  - Avoid for two named teams against each other; that is team_head_to_head. Avoid for the players on the team; that is player_performances.
common_questions:
  - How many matches did Team Liquid play in August 2026?
  - How did Team Spirit do on the current patch?
  - Which team has the highest win rate on the current patch?
  - Which team has won the most matches this month?
source:
  connection: warehouse
  table: marts.fact_team_match
default_time_field: started_at
primary_key: [match_id, side]
population: Both sides of every professional match in the loaded window in a league
  OpenDota rates premium or professional. A side OpenDota did not tie to a team has a null
  team and no name; it stays in the table so every match has two rows, and is left out of
  any grouping by team. Leagues it rates below professional are not counted.
fields:
  - {name: match_id, type: integer, description: OpenDota match id.}
  - {name: is_radiant, type: boolean, description: True for the Radiant side's row.}
  - {name: side, type: string, description: radiant or dire.}
  - {name: team_id, type: integer, description: The team on this side; null when OpenDota did not identify it.}
  - {name: team_name, type: string, description: The team on this side.}
  - {name: opponent_team_id, type: integer}
  - {name: opponent_team_name, type: string, description: The team on the other side.}
  - {name: is_win, type: boolean, description: True when this side won.}
  - {name: kills, type: integer, description: Hero kills by this side.}
  - {name: kills_against, type: integer, description: Hero kills by the other side.}
  - {name: has_first_pick, type: boolean, description: True when this side made the match's first pick; null when the match has no recorded draft.}
  - {name: started_at, type: timestamp, description: "Match start, UTC."}
  - {name: match_date, type: date, description: "Match start date, UTC."}
  - {name: duration_min, type: number, description: Game length in minutes.}
  - {name: patch_id, type: integer}
  - {name: patch_name, type: string, description: "Game version the match was played on, e.g. 7.41."}
  - {name: league_id, type: integer}
  - {name: league_name, type: string}
  - {name: league_tier, type: string, description: "OpenDota tier of the league: premium or professional (premium is the top tier)."}
  - {name: game_mode_id, type: integer}
  - {name: series_id, type: integer}
  - {name: series_type, type: integer, description: "0 = best of 1, 1 = best of 3, 2 = best of 5, 3 = best of 2; null when not reported."}
dimensions:
  - {name: team_name, type: string}
  - {name: opponent_team_name, type: string}
  - {name: side, type: string}
  - {name: has_first_pick, type: boolean}
  - {name: patch_name, type: string}
  - {name: league_name, type: string}
  - {name: league_tier, type: string}
  - {name: match_date, type: date}
metrics:
  - {name: matches_played, agg: count, expr: team_matches.match_id, description: "Matches the team played (games, not series); one row per team per match."}
  - {name: team_wins, agg: sum, expr: "CASE WHEN team_matches.is_win THEN 1 ELSE 0 END", description: Matches the team won.}
  - {name: team_losses, agg: sum, expr: "CASE WHEN team_matches.is_win THEN 0 ELSE 1 END", description: Matches the team lost.}
  - name: team_win_rate
    better: higher
    type: derived
    expr: "CASE WHEN {matches_played} >= 10 THEN {team_wins} * 1.0 / NULLIF({matches_played}, 0) END"
    format: percent
    description: Wins divided by matches for the team (the team_win_rate definition); null under 10 matches, so a team seen twice cannot top a ranking. State the match count beside it.
  - {name: team_avg_kills, agg: avg, expr: team_matches.kills, description: Average hero kills by the team per match.}
