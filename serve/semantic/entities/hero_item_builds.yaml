name: hero_item_builds
description: What pro players ended their games holding, per hero, item and patch — the six
  main inventory slots at the end of the match.
grain: one row per hero, item and patch
use_cases:
  - Use for what pros build on a hero and which items they win with.
  - Avoid for when an item was bought; that is item_timings.
common_questions:
  - What do pros build on Juggernaut this patch?
  - How often does Ember Spirit end with a Black King Bar?
source:
  connection: warehouse
  table: marts.hero_item_builds
primary_key: [patch_id, hero_id, item_id]
population: Final inventories from professional matches in leagues OpenDota rates premium
  or professional, in the loaded window; neutral items and backpack slots are left out.
  Leagues it rates below professional are not counted.
fields:
  - {name: patch_id, type: integer}
  - {name: patch_name, type: string}
  - {name: hero_id, type: integer}
  - {name: hero_name, type: string}
  - {name: item_id, type: integer}
  - {name: item_name, type: string, description: "Display name, e.g. Black King Bar."}
  - {name: item_cost, type: integer, description: Shop price in gold.}
  - {name: games_with_item, type: integer, description: Pro games the hero ended holding the item.}
  - {name: wins_with_item, type: integer}
  - {name: hero_games, type: integer, description: "Pro games the hero played on the patch; repeats on every item row, so never sum it across items."}
  - {name: is_major_item, type: boolean, description: "True for a major item: at least 2000 gold, assembled or with its own active ability, not a recipe, consumable or neutral item."}
dimensions:
  - {name: hero_name, type: string, description: "The hero."}
  - {name: item_name, type: string, description: "The item."}
  - {name: patch_name, type: string, description: "Game version; group by it only to compare patches."}
metrics:
  - {name: end_inventory_games, agg: sum, expr: hero_item_builds.games_with_item, description: "Pro games the hero ended holding the item in a main slot; rank by it for what pros build on a hero."}
  - {name: end_inventory_wins, agg: sum, expr: hero_item_builds.wins_with_item, description: "Of the games ending with the item, those won."}
  - name: item_win_rate
    better: higher
    type: derived
    expr: "CASE WHEN {end_inventory_games} >= 20 THEN {end_inventory_wins} * 1.0 / NULLIF({end_inventory_games}, 0) END"
    format: percent
    description: "Share of the hero's games ending with the item that were won; null under 20 games (the minimum_games term)."
