name: match_leads
description: One professional match's gold and XP leads at 10, 15, 20 and 25 minutes, the
  largest lead each side held, and whether the winner came back from 10 000 gold behind.
grain: one row per match
use_cases:
  - Use for how often the early leader wins, comebacks and throws, and one match's leads at 10, 15, 20 and 25 minutes.
  - Avoid for a minute-by-minute curve or the average lead at a minute; that is advantage_timeline.
common_questions:
  - How often does the team ahead at 20 minutes win?
  - How many comebacks were there on the current patch?
  - Which team threw the most games?
  - What was the biggest comeback this month?
source:
  connection: warehouse
  table: marts.match_leads
default_time_field: started_at
primary_key: [match_id]
population: Professional matches in the loaded window whose per-minute advantage OpenDota
  supplies. A lead at a minute mark is null when the match ended before it.
fields:
  - {name: match_id, type: integer}
  - {name: started_at, type: timestamp, description: "Match start, UTC."}
  - {name: match_date, type: date, description: "Match start date, UTC."}
  - {name: patch_id, type: integer}
  - {name: patch_name, type: string}
  - {name: league_id, type: integer}
  - {name: league_name, type: string}
  - {name: duration_min, type: number}
  - {name: radiant_win, type: boolean}
  - {name: winner_side, type: string, description: "radiant or dire."}
  - {name: radiant_team_name, type: string}
  - {name: dire_team_name, type: string}
  - {name: winner_team_name, type: string}
  - {name: loser_team_name, type: string}
  - {name: radiant_gold_adv_10, type: integer, description: "Radiant gold advantage at minute 10; negative = Dire ahead."}
  - {name: radiant_gold_adv_15, type: integer}
  - {name: radiant_gold_adv_20, type: integer}
  - {name: radiant_gold_adv_25, type: integer}
  - {name: radiant_xp_adv_10, type: integer, description: "Radiant experience advantage at minute 10; negative = Dire ahead."}
  - {name: radiant_xp_adv_15, type: integer}
  - {name: radiant_xp_adv_20, type: integer}
  - {name: radiant_xp_adv_25, type: integer}
  - {name: winner_gold_adv_10, type: integer, description: "The eventual winner's gold advantage at minute 10; negative = behind."}
  - {name: winner_gold_adv_15, type: integer}
  - {name: winner_gold_adv_20, type: integer}
  - {name: winner_gold_adv_25, type: integer}
  - {name: max_radiant_gold_lead, type: integer}
  - {name: max_dire_gold_lead, type: integer}
  - {name: max_winner_deficit, type: integer, description: Largest gold deficit the winner faced at any minute; 0 when never behind.}
  - {name: max_winner_lead, type: integer, description: Largest gold lead the winner held at any minute.}
  - {name: is_comeback, type: boolean, description: "True when the winner trailed by 10 000 gold or more at some minute (the comeback definition)."}
  - {name: comeback_team_name, type: string, description: The winning team of a comeback match.}
  - {name: throw_team_name, type: string, description: "The losing team of a comeback match: it held a lead of 10 000 gold or more and lost."}
  - {name: leader_at_10_won, type: boolean, description: "True when the side ahead in gold at minute 10 won; null when level or the match ended earlier."}
  - {name: leader_at_20_won, type: boolean, description: "True when the side ahead in gold at minute 20 won; null when level or the match ended earlier."}
dimensions:
  - {name: patch_name, type: string}
  - {name: league_name, type: string}
  - {name: match_date, type: date}
  - {name: winner_side, type: string}
  - {name: winner_team_name, type: string}
  - {name: loser_team_name, type: string}
  - {name: comeback_team_name, type: string}
  - {name: throw_team_name, type: string}
metrics:
  - {name: lead_matches, agg: count, expr: match_leads.match_id, description: Matches with a per-minute advantage.}
  - {name: comebacks, agg: sum, expr: "CASE WHEN match_leads.is_comeback THEN 1 ELSE 0 END", description: Matches the winner won from 10 000 gold or more behind.}
  - name: comeback_rate
    type: ratio
    numerator: comebacks
    denominator: lead_matches
    format: percent
    description: Share of matches that were comebacks.
  - {name: leader_at_10_games, agg: sum, expr: "CASE WHEN match_leads.leader_at_10_won IS NOT NULL THEN 1 ELSE 0 END", description: Matches with a gold leader at minute 10.}
  - {name: leader_at_10_wins, agg: sum, expr: "CASE WHEN match_leads.leader_at_10_won THEN 1 ELSE 0 END", description: "Of those, matches the minute-10 leader won."}
  - name: leader_at_10_win_rate
    type: ratio
    numerator: leader_at_10_wins
    denominator: leader_at_10_games
    format: percent
    description: How often the side ahead in gold at minute 10 won.
  - {name: leader_at_20_games, agg: sum, expr: "CASE WHEN match_leads.leader_at_20_won IS NOT NULL THEN 1 ELSE 0 END", description: Matches with a gold leader at minute 20.}
  - {name: leader_at_20_wins, agg: sum, expr: "CASE WHEN match_leads.leader_at_20_won THEN 1 ELSE 0 END", description: "Of those, matches the minute-20 leader won."}
  - name: leader_at_20_win_rate
    type: ratio
    numerator: leader_at_20_wins
    denominator: leader_at_20_games
    format: percent
    description: How often the side ahead in gold at minute 20 won.
  - {name: throws, agg: count, expr: match_leads.throw_team_name, description: "Matches a team lost after leading by 10 000 gold or more; group by throw_team_name for the team that threw."}
  - {name: comeback_wins, agg: count, expr: match_leads.comeback_team_name, description: "Matches a team won after trailing by 10 000 gold or more; group by comeback_team_name for the team that came back."}
  - {name: biggest_comeback_gold, agg: max, expr: match_leads.max_winner_deficit, description: Largest gold deficit any winner overcame.}
