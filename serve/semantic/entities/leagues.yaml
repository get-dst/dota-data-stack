name: leagues
description: Tournaments and leagues OpenDota rates premium or professional, with the tier.
grain: one row per league
source:
  connection: warehouse
  table: marts.dim_league
primary_key: [league_id]
population: Leagues and tournaments OpenDota rates premium or professional. Leagues it rates
  below professional, or does not rate, are not listed.
fields:
  - {name: league_id, type: integer}
  - {name: league_name, type: string}
  - {name: league_tier, type: string, description: "League tier: premium for the top events, such as The International; every other league here holds the standard tier. A filter only for a question about premium or top-tier tournaments."}
dimensions:
  - {name: league_name, type: string, description: "League or tournament."}
  - {name: league_tier, type: string, description: "League tier: premium for the top events, such as The International; every other league here holds the standard tier. A filter only for a question about premium or top-tier tournaments."}
metrics:
  - {name: league_count, agg: count, expr: leagues.league_id, description: "Number of leagues."}
