name: pub_hero_by_duration
description: Hero win rate by how long the game went, per rank bracket, over the public
  sample, ranked All Pick only — which heroes win the short games and which the long ones.
grain: one row per hero, patch, rank bracket and duration bucket
use_cases:
  - Use for whether a hero wins more in long or short games.
  - bucket_win_rate is null under 20 games (the minimum_games term), so a ranking lists only heroes past the floor in that bucket; report the game count with every rate.
  - Avoid for overall win rate; that is pub_hero_stats.
common_questions:
  - Does Anti-Mage win more in games over 45 minutes?
  - Which heroes are best in short games?
  - Which heroes are best in games under 25 minutes at Legend?
source:
  connection: warehouse
  table: marts.pub_hero_by_duration
primary_key: [patch_id, bracket_id, hero_id, duration_bucket_order]
population: Counted over a sample of public matchmaking games. Only ranked All Pick games
  are in this table (filtered when it was built; it has no game_type column).
fields:
  - {name: patch_id, type: integer}
  - {name: patch_name, type: string}
  - {name: bracket_id, type: integer}
  - {name: bracket_name, type: string, description: "Herald, Guardian, Crusader, Archon, Legend, Ancient, Divine, Immortal."}
  - {name: hero_id, type: integer}
  - {name: hero_name, type: string}
  - {name: duration_bucket, type: string, description: "under 25 min, 25-35 min, 35-45 min, 45 min and over."}
  - {name: duration_bucket_order, type: integer, description: "1 to 4, shortest to longest."}
  - {name: games, type: integer}
  - {name: wins, type: integer}
dimensions:
  - {name: hero_name, type: string, description: "The hero."}
  - {name: duration_bucket, type: string, description: "under 25 min, 25-35 min, 35-45 min, 45 min and over."}
  - {name: bracket_name, type: string, description: "Rank bracket, Herald to Immortal."}
  - {name: patch_name, type: string, description: "Game version; group by it only to compare patches."}
metrics:
  - {name: bucket_games, agg: sum, expr: pub_hero_by_duration.games, description: "Sampled games of the hero in the duration bucket."}
  - {name: bucket_wins, agg: sum, expr: pub_hero_by_duration.wins, description: "Of those, games won."}
  - name: bucket_win_rate
    better: higher
    type: derived
    expr: "CASE WHEN {bucket_games} >= 20 THEN {bucket_wins} * 1.0 / NULLIF({bucket_games}, 0) END"
    format: percent
    description: Wins divided by games in the duration bucket; null under 20 games (the minimum_games term), so a thin bucket cannot rank first.
