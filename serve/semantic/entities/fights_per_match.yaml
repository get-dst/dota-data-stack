name: fights_per_match
description: "One player's teamfights in one parsed professional match: fights present in, participation, deaths inside and outside fights, and the gold, XP and damage of the fights."
grain: "one row per player per parsed match"
use_cases:
  - "Use for teamfight numbers by team, league or date, or for one match."
  - "For rankings of heroes, positions or players use hero_playstyle or player_playstyle, which carry the games floor; hero_name and player_name are filters here, not groupings."
common_questions:
  - "Which team has the highest teamfight participation?"
  - "How many teamfights were there in match 9015110394?"
source:
  connection: warehouse
  table: marts.player_fight_stats
default_time_field: started_at
primary_key: [match_id, player_slot]
population: Players in parsed professional matches in leagues OpenDota rates premium or
  professional, in the loaded window; a match with no teamfight has match_fights = 0.
  Leagues it rates below professional are not counted.
fields:
  - {name: match_id, type: integer}
  - {name: player_slot, type: integer, description: "0-4 Radiant, 128-132 Dire."}
  - {name: is_radiant, type: boolean}
  - {name: team_id, type: integer}
  - {name: team_name, type: string, description: "Team name as the match record carries it; null when OpenDota lists no team for the side, so a team ranking leaves the null rows out."}
  - {name: account_id, type: integer}
  - {name: player_name, type: string}
  - {name: hero_id, type: integer}
  - {name: hero_name, type: string}
  - {name: position, type: integer, description: "1 carry, 2 mid, 3 offlane, 4 soft support, 5 hard support; null for jungle, roaming or unparsed lanes."}
  - {name: position_name, type: string, description: "The position as a word: carry, mid, offlane, soft support or hard support; the filter for questions about carries, mids, offlaners or supports."}
  - {name: is_win, type: boolean}
  - {name: match_fights, type: integer, description: "Teamfights in the match."}
  - {name: fights_present, type: integer}
  - {name: fight_participation, type: number, description: "fights_present / match_fights, 0-1; null without a teamfight."}
  - {name: fight_kills, type: integer}
  - {name: fight_deaths, type: integer}
  - {name: total_deaths, type: integer}
  - {name: deaths_outside_fights, type: integer}
  - {name: fight_buybacks, type: integer}
  - {name: fight_damage, type: integer, description: "Hero damage inside fight windows."}
  - {name: fight_healing, type: integer}
  - {name: fight_gold_delta, type: integer, description: "Gold gained over fight windows (passive income included)."}
  - {name: fight_xp_delta, type: integer}
  - {name: started_at, type: timestamp}
  - {name: match_date, type: date}
  - {name: patch_id, type: integer}
  - {name: patch_name, type: string}
  - {name: league_id, type: integer}
  - {name: league_name, type: string}
  - {name: duration_min, type: number}
dimensions:
  - {name: team_name, type: string}
  - {name: patch_name, type: string}
  - {name: league_name, type: string}
  - {name: position, type: integer}
  - {name: position_name, type: string}
  - {name: match_date, type: date}
metrics:
  - {name: fight_player_games, agg: count, expr: "fights_per_match.match_id", description: "Player-games (rows)."}
  - {name: fights_in_games, agg: sum, expr: "fights_per_match.match_fights"}
  - {name: avg_teamfights_per_match, agg: avg, expr: "fights_per_match.match_fights", description: "Teamfights per match; the same for all ten players of a match, so the average over player-games is the average over matches."}
  - {name: fights_attended, agg: sum, expr: "fights_per_match.fights_present"}
  - name: team_fight_participation
    better: higher
    type: ratio
    numerator: fights_attended
    denominator: fights_in_games
    format: percent
    description: "Share of teamfights the players were present in, for a team, league, date or match. A hero, position or player rate is hero_playstyle.fight_participation or player_playstyle."
  - {name: avg_fight_gold_swing, agg: avg, expr: "fights_per_match.fight_gold_delta", better: higher, description: "Gold gained over teamfight windows per player-game."}
  - {name: avg_deaths_outside_fights, agg: avg, expr: "fights_per_match.deaths_outside_fights", better: lower, description: "Deaths outside teamfights per player-game."}
  - {name: avg_fight_deaths, agg: avg, expr: "fights_per_match.fight_deaths", better: lower, description: "Deaths inside teamfights per player-game."}
