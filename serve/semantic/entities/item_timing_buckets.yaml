name: item_timing_buckets
description: Does an earlier item win more? Per hero, major item and patch, the games in which
  the hero first completed the item inside each timing window (under 15, 15-20, 20-25, 25-30
  and 30+ minutes) and how many of them were won.
grain: one row per hero, major item, patch and timing window
use_cases:
  - Use for win rate by item timing, e.g. "does an early Black King Bar win more on Ember Spirit?"
  - Sort windows by bucket_order, not by the label.
  - When comparing windows by win rate, report the game count of each; a window under 20 games is noise (minimum_games).
  - Avoid for the typical minute of an item; that is item_timings or hero_core_items.
common_questions:
  - Does an early Black King Bar win more on Earth Spirit?
  - What is the win rate of Blink Dagger bought before 15 minutes?
  - In which timing window do pros finish Battle Fury on Anti-Mage?
source:
  connection: warehouse
  table: marts.item_timing_buckets
primary_key: [patch_id, hero_id, item_id, bucket_order]
population: First completions of major items in professional matches in leagues OpenDota
  rates premium or professional, in the loaded window, that have a purchase log. Leagues
  it rates below professional are not counted.
fields:
  - {name: patch_id, type: integer}
  - {name: patch_name, type: string}
  - {name: hero_id, type: integer}
  - {name: hero_name, type: string}
  - {name: item_id, type: integer}
  - {name: item_name, type: string}
  - {name: item_cost, type: integer}
  - {name: bucket_order, type: integer, description: "1 to 5, earliest window first."}
  - {name: timing_bucket, type: string, description: "<15, 15-20, 20-25, 25-30 or 30+ minutes; a window includes its first minute and excludes its last."}
  - {name: bucket_start_min, type: integer, description: "First minute of the window: 0, 15, 20, 25 or 30."}
  - {name: games, type: integer, description: Pro games in which the hero first completed the item inside the window.}
  - {name: wins, type: integer}
dimensions:
  - {name: hero_name, type: string, description: "The hero."}
  - {name: item_name, type: string, description: "The item."}
  - {name: patch_name, type: string, description: "Game version; group by it only to compare patches."}
  - {name: timing_bucket, type: string, description: "<15, 15-20, 20-25, 25-30 or 30+ minutes; a window includes its first minute and excludes its last."}
metrics:
  - {name: timing_games, agg: sum, expr: item_timing_buckets.games, description: "Pro games in which the hero first finished the item inside the window."}
  - {name: timing_wins, agg: sum, expr: item_timing_buckets.wins, description: "Of those games, those won."}
  - name: timing_win_rate
    better: higher
    type: derived
    expr: "CASE WHEN {timing_games} >= 20 THEN {timing_wins} * 1.0 / NULLIF({timing_games}, 0) END"
    format: percent
    description: "Share of the games with the item finished in the window that were won; null under 20 games (the minimum_games term), so compare windows only where both have a rate."
