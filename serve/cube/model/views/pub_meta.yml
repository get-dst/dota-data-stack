views:
- name: pub_meta_lens
  title: Dota 2 pub meta
  description: Hero win rates, counters and duos by rank bracket, from a sample of public ranked matches on OpenDota.
  meta:
    dst:
      sources: []
  cubes:
  - join_path: pub_matches
    includes:
    - match_id
    - started_at
    - match_date
    - duration_min
    - radiant_win
    - avg_rank_tier
    - bracket_id
    - bracket_name
    - game_type
    - patch_id
    - patch_name
    - match_count
    - avg_duration_min
    - radiant_wins
    - radiant_win_rate
    prefix: true
  - join_path: pub_hero_stats
    includes:
    - patch_id
    - patch_name
    - bracket_id
    - bracket_name
    - game_type
    - hero_id
    - hero_name
    - games
    - wins
    - losses
    - matches_in_bracket
    - hero_games
    - hero_wins
    - hero_win_rate
    - bracket_matches
    - pub_pick_rate
    - pub_pick_rate
    prefix: true
  - join_path: pub_matchups
    includes:
    - patch_id
    - patch_name
    - game_type
    - hero_id
    - hero_name
    - opponent_hero_id
    - opponent_hero_name
    - games
    - wins
    - matchup_games
    - matchup_wins
    - matchup_win_rate
    - counter
    prefix: true
  - join_path: pub_duos
    includes:
    - patch_id
    - patch_name
    - game_type
    - hero_id
    - hero_name
    - ally_hero_id
    - ally_hero_name
    - games
    - wins
    - duo_games
    - duo_wins
    - duo_win_rate
    - synergy
    prefix: true
  - join_path: pub_hero_trends
    includes:
    - match_date
    - patch_id
    - patch_name
    - hero_id
    - hero_name
    - games
    - wins
    - daily_games
    - daily_wins
    - daily_win_rate
    - trend
    prefix: true
  - join_path: pub_hero_by_duration
    includes:
    - patch_id
    - patch_name
    - bracket_id
    - bracket_name
    - hero_id
    - hero_name
    - duration_bucket
    - duration_bucket_order
    - games
    - wins
    - bucket_games
    - bucket_wins
    - bucket_win_rate
    prefix: true
  - join_path: heroes
    includes:
    - hero_id
    - hero_name
    - hero_key
    - primary_attribute
    - attack_type
    - roles
    - hero_count
    prefix: true
  - join_path: patches
    includes:
    - patch_id
    - patch_name
    - patch_started_at
    - patch_ended_at
    - is_current
    - patch_count
    prefix: true
  - join_path: brackets
    includes:
    - bracket_id
    - bracket_name
    - bracket_count
    prefix: true
- name: pub_meta_pub_duos
  title: 'Dota 2 pub meta: pub_duos with its dimensions'
