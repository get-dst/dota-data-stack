cubes:
- name: pub_hero_by_duration
  title: pub hero by duration
  description: Hero win rate by how long the game went, per rank bracket, over the public sample, ranked All Pick
    only — which heroes win the short games and which the long ones.
  sql_table: marts.pub_hero_by_duration
  meta:
    dst:
      grain: one row per hero, patch, rank bracket and duration bucket
      key:
      - patch_id
      - bracket_id
      - hero_id
      - duration_bucket_order
      population: Counted over a sample of public matchmaking games. Only ranked All Pick games are in this table
        (filtered when it was built; it has no game_type column).
  joins:
  - name: brackets
    relationship: many_to_one
    sql: '{CUBE}.bracket_id = {brackets}.bracket_id'
  - name: heroes
    relationship: many_to_one
    sql: '{CUBE}.hero_id = {heroes}.hero_id'
  - name: patches
    relationship: many_to_one
    sql: '{CUBE}.patch_id = {patches}.patch_id'
  dimensions:
  - name: patch_id
    sql: '{CUBE}.patch_id'
    type: number
    primary_key: true
    public: true
  - name: patch_name
    sql: '{CUBE}.patch_name'
    type: string
    meta:
      dst:
        dictionary:
        - '7.41'
  - name: bracket_id
    sql: '{CUBE}.bracket_id'
    type: number
    primary_key: true
    public: true
  - name: bracket_name
    sql: '{CUBE}.bracket_name'
    type: string
    description: Herald, Guardian, Crusader, Archon, Legend, Ancient, Divine, Immortal.
    meta:
      dst:
        dictionary:
        - Archon
        - Crusader
        - Legend
        - Ancient
        - Divine
        - Guardian
        - Herald
  - name: hero_id
    sql: '{CUBE}.hero_id'
    type: number
    primary_key: true
    public: true
  - name: hero_name
    sql: '{CUBE}.hero_name'
    type: string
  - name: duration_bucket
    sql: '{CUBE}.duration_bucket'
    type: string
    description: under 25 min, 25-35 min, 35-45 min, 45 min and over.
    meta:
      dst:
        dictionary:
        - 25-35 min
        - 35-45 min
        - under 25 min
        - 45 min and over
  - name: duration_bucket_order
    sql: '{CUBE}.duration_bucket_order'
    type: number
    description: 1 to 4, shortest to longest.
    primary_key: true
    public: true
  - name: games
    sql: '{CUBE}.games'
    type: number
  - name: wins
    sql: '{CUBE}.wins'
    type: number
  measures:
  - name: bucket_games
    title: bucket_games
    description: Sampled games of the hero in the duration bucket.
    type: sum
    sql: '{CUBE}.games'
  - name: bucket_wins
    title: bucket_wins
    description: Of those, games won.
    type: sum
    sql: '{CUBE}.wins'
  - name: bucket_win_rate
    title: bucket_win_rate
    description: Wins divided by games in the duration bucket; null under 20 games (the minimum_games term), so
      a thin bucket cannot rank first.
    type: number
    sql: CASE WHEN {bucket_games} >= 20 THEN {bucket_wins} * 1.0 / NULLIF({bucket_games}, 0) END
    format: percent
    meta:
      dst:
        better: higher
