cubes:
- name: pro_draft_matchups
  title: pro draft matchups
  description: Hero against hero in professional matches, per patch — games the two were picked on opposite sides
    and how many the first one won. Both orderings are present, so start from either hero.
  sql_table: marts.pro_draft_matchups
  meta:
    dst:
      grain: one row per hero, opponent hero and patch
      key:
      - patch_id
      - hero_id
      - opponent_hero_id
      population: Every professional match in a league OpenDota rates premium or professional, with its ten player
        rows, in any game mode. Pro samples are small; a pair with few games says little, so state the game count
        with the rate. Leagues it rates below professional are not counted.
  joins:
  - name: heroes
    relationship: many_to_one
    sql: '{CUBE}.hero_id = {heroes}.hero_id'
  - name: patches
    relationship: many_to_one
    sql: '{CUBE}.patch_id = {patches}.patch_id'
  dimensions:
  - name: patch_id
    sql: '{CUBE}.patch_id'
    type: number
    primary_key: true
    public: true
  - name: patch_name
    sql: '{CUBE}.patch_name'
    type: string
    meta:
      dst:
        dictionary:
        - '7.39'
        - '7.41'
        - '7.40'
  - name: hero_id
    sql: '{CUBE}.hero_id'
    type: number
    primary_key: true
    public: true
  - name: hero_name
    sql: '{CUBE}.hero_name'
    type: string
    description: The hero the rate is measured for.
  - name: opponent_hero_id
    sql: '{CUBE}.opponent_hero_id'
    type: number
    primary_key: true
    public: true
  - name: opponent_hero_name
    sql: '{CUBE}.opponent_hero_name'
    type: string
    description: The hero picked by the other side.
  - name: games
    sql: '{CUBE}.games'
    type: number
    description: Pro matches the two were on opposite sides.
  - name: wins
    sql: '{CUBE}.wins'
    type: number
    description: Of those, the ones hero_name's side won.
  measures:
  - name: pro_matchup_games
    title: pro_matchup_games
    description: Pro matches the two heroes were on opposite sides; the sample size beside the matchup rate.
    type: sum
    sql: '{CUBE}.games'
  - name: pro_matchup_wins
    title: pro_matchup_wins
    description: Of those, matches hero_name's side won.
    type: sum
    sql: '{CUBE}.wins'
  - name: pro_matchup_win_rate
    title: pro_matchup_win_rate
    description: Share of pro matches hero_name's side won against opponent_hero_name (the pro_counter term); null
      under 20 games. Filter hero_name to the hero asked about and rank opponents lowest first for its counters,
      highest first for the heroes it beats.
    type: number
    sql: CASE WHEN {pro_matchup_games} >= 20 THEN {pro_matchup_wins} * 1.0 / NULLIF({pro_matchup_games}, 0) END
    format: percent
    meta:
      dst:
        better: higher
  segments:
  - name: pro_counter
    sql: SUM({CUBE}.wins) * 1.0 / SUM({CUBE}.games)
    meta:
      dst:
        meaning: In pro play, a hero that the asked-about hero loses to more than usual, measured on pro_draft_matchups.
        aliases:
        - counter
        - counters
        - pro counter
        - counters in pro play
        - pro matchup
        - bad matchup in pro
        - counter in drafts
        term: pro_counter
