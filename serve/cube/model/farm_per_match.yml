cubes:
- name: farm_per_match
  title: farm per match
  description: 'One player''s share of the side''s farm in one parsed professional match: gold earned at minutes
    10 and 20 over the five players'' total, last hits at 10 and 20, and farm and net-worth rank inside the side.'
  sql_table: marts.farm_priority
  meta:
    dst:
      grain: one row per player per parsed match that reached minute 10
      key:
      - match_id
      - player_slot
      population: Players in parsed professional matches in leagues OpenDota rates premium or professional that
        reached minute 10; minute-20 columns are null in shorter games. Leagues it rates below professional are
        not counted.
  joins:
  - name: heroes
    relationship: many_to_one
    sql: '{CUBE}.hero_id = {heroes}.hero_id'
  - name: patches
    relationship: many_to_one
    sql: '{CUBE}.patch_id = {patches}.patch_id'
  - name: pro_matches
    relationship: many_to_one
    sql: '{CUBE}.match_id = {pro_matches}.match_id'
  - name: teams
    relationship: many_to_one
    sql: '{CUBE}.team_id = {teams}.team_id'
  dimensions:
  - name: match_id
    sql: '{CUBE}.match_id'
    type: number
    primary_key: true
    public: true
  - name: player_slot
    sql: '{CUBE}.player_slot'
    type: number
    description: 0-4 Radiant, 128-132 Dire.
    primary_key: true
    public: true
  - name: is_radiant
    sql: '{CUBE}.is_radiant'
    type: boolean
  - name: team_id
    sql: '{CUBE}.team_id'
    type: number
  - name: team_name
    sql: '{CUBE}.team_name'
    type: string
    description: Team name as the match record carries it; null when OpenDota lists no team for the side, so a team
      ranking leaves the null rows out.
  - name: account_id
    sql: '{CUBE}.account_id'
    type: number
  - name: player_name
    sql: '{CUBE}.player_name'
    type: string
  - name: hero_id
    sql: '{CUBE}.hero_id'
    type: number
  - name: hero_name
    sql: '{CUBE}.hero_name'
    type: string
  - name: position
    sql: '{CUBE}.position'
    type: number
    description: 1 carry, 2 mid, 3 offlane, 4 soft support, 5 hard support; null for jungle, roaming or unparsed
      lanes.
  - name: position_name
    sql: '{CUBE}.position_name'
    type: string
    description: 'The position as a word: carry, mid, offlane, soft support or hard support; the filter for questions
      about carries, mids, offlaners or supports.'
    meta:
      dst:
        dictionary:
        - mid
        - carry
        - offlane
        - hard support
        - soft support
  - name: is_win
    sql: '{CUBE}.is_win'
    type: boolean
  - name: gold_10
    sql: '{CUBE}.gold_10'
    type: number
    description: Gold earned since the horn at minute 10.
  - name: team_gold_10
    sql: '{CUBE}.team_gold_10'
    type: number
  - name: farm_share_10
    sql: '{CUBE}.farm_share_10'
    type: number
    description: gold_10 / team_gold_10, 0-1.
  - name: gold_20
    sql: '{CUBE}.gold_20'
    type: number
  - name: team_gold_20
    sql: '{CUBE}.team_gold_20'
    type: number
  - name: farm_share_20
    sql: '{CUBE}.farm_share_20'
    type: number
    description: 0-1; null before minute 20.
  - name: last_hits_10
    sql: '{CUBE}.last_hits_10'
    type: number
  - name: last_hits_20
    sql: '{CUBE}.last_hits_20'
    type: number
  - name: farm_rank_10
    sql: '{CUBE}.farm_rank_10'
    type: number
    description: 1 = most gold on the side at minute 10.
  - name: net_worth
    sql: '{CUBE}.net_worth'
    type: number
  - name: networth_rank
    sql: '{CUBE}.networth_rank'
    type: number
    description: 1 = richest on the side at game end.
  - name: match_date
    sql: '{CUBE}.match_date'
    type: time
  - name: patch_id
    sql: '{CUBE}.patch_id'
    type: number
  - name: patch_name
    sql: '{CUBE}.patch_name'
    type: string
    meta:
      dst:
        dictionary:
        - '7.39'
        - '7.41'
        - '7.40'
  - name: league_id
    sql: '{CUBE}.league_id'
    type: number
  - name: league_name
    sql: '{CUBE}.league_name'
    type: string
  - name: duration_min
    sql: '{CUBE}.duration_min'
    type: number
  measures:
  - name: farm_player_games
    title: farm_player_games
    description: Player-games (rows) that reached minute 10.
    type: count
    sql: '{CUBE}.match_id'
  - name: avg_gold_at_10
    title: avg_gold_at_10
    description: Average gold earned by minute 10, per player-game.
    type: avg
    sql: '{CUBE}.gold_10'
    meta:
      dst:
        better: higher
  - name: avg_lh_at_10
    title: avg_lh_at_10
    description: Average last hits at minute 10, per player-game.
    type: avg
    sql: '{CUBE}.last_hits_10'
    meta:
      dst:
        better: higher
  - name: farm_matches
    title: farm_matches
    description: Distinct matches in scope; a team's games. The team farm share is null under 20 of them.
    type: count_distinct
    sql: '{CUBE}.match_id'
  - name: farm_share_10_sum
    title: farm_share_10_sum
    description: Share of the side's gold at minute 10, summed over player-games; divide by farm_player_games.
    type: sum
    sql: '{CUBE}.farm_share_10'
  - name: team_farm_share_10
    title: team_farm_share_10
    description: 'Average share of the side''s gold at minute 10 per player-game, for a team, league or date, usually
      filtered to one position (the farm_share term): how much of a team''s farm its carry takes. Null under 20
      matches. A hero, position or player share is hero_playstyle.farm_share_10 or player_playstyle.'
    type: number
    sql: CASE WHEN {farm_matches} >= 20 THEN {farm_share_10_sum} * 1.0 / NULLIF({farm_player_games}, 0) END
    format: percent
