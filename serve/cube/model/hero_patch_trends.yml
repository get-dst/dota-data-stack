cubes:
- name: hero_patch_trends
  title: hero patch trends
  description: Per hero and patch over professional matches — picks, bans, wins, pick, ban and win rate — beside
    the same numbers on the previous patch and the change between them. The smallest table for a hero's numbers
    on the current patch ("this patch", "right now") or any one patch, including the hero meta of a patch.
  sql_table: marts.hero_patch_trends
  meta:
    dst:
      grain: one row per hero per patch
      key:
      - patch_id
      - hero_id
      population: Every hero on every patch with professional matches in the loaded window, in leagues OpenDota
        rates premium or professional; a hero nobody picked or banned on a patch has zero picks and bans there.
        The previous-patch columns and the changes are null when the window holds no match of the previous patch.
        Leagues it rates below professional are not counted.
  joins:
  - name: heroes
    relationship: many_to_one
    sql: '{CUBE}.hero_id = {heroes}.hero_id'
  - name: patches
    relationship: many_to_one
    sql: '{CUBE}.patch_id = {patches}.patch_id'
  dimensions:
  - name: patch_id
    sql: '{CUBE}.patch_id'
    type: number
    primary_key: true
    public: true
  - name: patch_name
    sql: '{CUBE}.patch_name'
    type: string
    meta:
      dst:
        dictionary:
        - '7.39'
        - '7.40'
        - '7.41'
  - name: patch_started_at
    sql: '{CUBE}.patch_started_at'
    type: time
  - name: is_current_patch
    sql: '{CUBE}.is_current_patch'
    type: boolean
    description: True for the patch in play now.
  - name: hero_id
    sql: '{CUBE}.hero_id'
    type: number
    primary_key: true
    public: true
  - name: hero_name
    sql: '{CUBE}.hero_name'
    type: string
  - name: matches_on_patch
    sql: '{CUBE}.matches_on_patch'
    type: number
    description: Pro matches on the patch; repeats on every hero row, never sum it across heroes.
  - name: picks
    sql: '{CUBE}.picks'
    type: number
    description: Matches the hero was picked in.
  - name: bans
    sql: '{CUBE}.bans'
    type: number
  - name: wins
    sql: '{CUBE}.wins'
    type: number
  - name: losses
    sql: '{CUBE}.losses'
    type: number
  - name: win_rate
    sql: '{CUBE}.win_rate'
    type: number
    description: wins / picks, 0-1.
  - name: pick_rate
    sql: '{CUBE}.pick_rate'
    type: number
    description: picks / matches_on_patch, 0-1.
  - name: ban_rate
    sql: '{CUBE}.ban_rate'
    type: number
    description: bans / matches_on_patch, 0-1.
  - name: previous_patch_id
    sql: '{CUBE}.previous_patch_id'
    type: number
  - name: previous_patch_name
    sql: '{CUBE}.previous_patch_name'
    type: string
    meta:
      dst:
        dictionary:
        - '7.38'
        - '7.39'
        - '7.40'
  - name: previous_matches
    sql: '{CUBE}.previous_matches'
    type: number
  - name: previous_picks
    sql: '{CUBE}.previous_picks'
    type: number
  - name: previous_bans
    sql: '{CUBE}.previous_bans'
    type: number
  - name: previous_win_rate
    sql: '{CUBE}.previous_win_rate'
    type: number
  - name: previous_pick_rate
    sql: '{CUBE}.previous_pick_rate'
    type: number
  - name: previous_ban_rate
    sql: '{CUBE}.previous_ban_rate'
    type: number
  - name: win_rate_change
    sql: '{CUBE}.win_rate_change'
    type: number
    description: win_rate minus previous_win_rate, in rate points (0.05 = five points).
  - name: pick_rate_change
    sql: '{CUBE}.pick_rate_change'
    type: number
    description: pick_rate minus previous_pick_rate.
  - name: ban_rate_change
    sql: '{CUBE}.ban_rate_change'
    type: number
    description: ban_rate minus previous_ban_rate.
  measures:
  - name: patch_picks
    title: patch_picks
    description: Times the hero was picked on the patch or patches in scope; rank by it for the most-picked heroes
      of a patch.
    type: sum
    sql: '{CUBE}.picks'
  - name: patch_bans
    title: patch_bans
    description: Times the hero was banned on the patch or patches in scope; rank by it for the most-banned heroes
      of a patch.
    type: sum
    sql: '{CUBE}.bans'
  - name: patch_wins
    title: patch_wins
    description: Picks of the hero whose side won, on the patch or patches in scope.
    type: sum
    sql: '{CUBE}.wins'
  - name: patch_win_rate
    title: patch_win_rate
    description: Wins divided by picks for the hero on the patch; null under 20 picks (the minimum_games term),
      so a rarely picked hero cannot rank first.
    type: number
    sql: CASE WHEN {patch_picks} >= 20 THEN {patch_wins} * 1.0 / NULLIF({patch_picks}, 0) END
    format: percent
    meta:
      dst:
        better: higher
  - name: patch_matches
    title: patch_matches
    description: 'Pro matches on the hero''s patches: the denominator of its pick and ban rate. Summed over one
      hero''s patch rows it is the match count of those patches; never read it summed over several heroes.'
    type: sum
    sql: '{CUBE}.matches_on_patch'
  - name: patch_pick_rate
    title: patch_pick_rate
    description: 'Share of pro matches in which the hero was picked (the pick_rate term): picks over the matches
      of the patch or patches in scope. Group or filter by hero; report patch_picks beside it.'
    type: number
    sql: '{patch_picks} / NULLIF({patch_matches}, 0)'
    format: percent
  - name: patch_ban_rate
    title: patch_ban_rate
    description: 'Share of pro matches in which the hero was banned (the ban_rate term): bans over the matches of
      the patch or patches in scope. Group or filter by hero; report patch_bans beside it.'
    type: number
    sql: '{patch_bans} / NULLIF({patch_matches}, 0)'
    format: percent
  - name: pick_rate_change_vs_previous
    title: pick_rate_change_vs_previous
    description: Change in pick rate from the previous patch (group by hero and patch); null without previous-patch
      matches.
    type: max
    sql: '{CUBE}.pick_rate_change'
    format: percent
  - name: win_rate_change_vs_previous
    title: win_rate_change_vs_previous
    description: Change in win rate from the previous patch (group by hero and patch); null without previous-patch
      picks.
    type: max
    sql: '{CUBE}.win_rate_change'
    format: percent
  segments:
  - name: ban_rate
    sql: SUM({CUBE}.bans) * 1.0 / SUM({CUBE}.matches_on_patch)
    meta:
      dst:
        meaning: Share of pro matches in which a hero was banned by either side.
        aliases:
        - ban %
        term: ban_rate
  - name: pick_rate
    sql: SUM({CUBE}.picks) * 1.0 / SUM({CUBE}.matches_on_patch)
    meta:
      dst:
        meaning: Share of pro matches in which a hero was picked by either side.
        aliases:
        - pick %
        - popularity
        term: pick_rate
