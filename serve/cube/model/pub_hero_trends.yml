cubes:
- name: pub_hero_trends
  title: pub hero trends
  description: Hero games and wins per day over the public sample, ranked All Pick only — the day series behind
    "is this hero rising or falling".
  sql_table: marts.daily_pub_hero_stats
  meta:
    dst:
      grain: one row per hero per day
      key:
      - match_date
      - hero_id
      population: Counted over a sample of public matchmaking games. Only ranked All Pick games are in this table
        (filtered when it was built; it has no game_type column). Days with few sampled games swing wildly; read
        the game count.
  joins:
  - name: heroes
    relationship: many_to_one
    sql: '{CUBE}.hero_id = {heroes}.hero_id'
  - name: patches
    relationship: many_to_one
    sql: '{CUBE}.patch_id = {patches}.patch_id'
  dimensions:
  - name: match_date
    sql: '{CUBE}.match_date'
    type: time
    primary_key: true
    public: true
  - name: patch_id
    sql: '{CUBE}.patch_id'
    type: number
  - name: patch_name
    sql: '{CUBE}.patch_name'
    type: string
    meta:
      dst:
        dictionary:
        - '7.41'
  - name: hero_id
    sql: '{CUBE}.hero_id'
    type: number
    primary_key: true
    public: true
  - name: hero_name
    sql: '{CUBE}.hero_name'
    type: string
  - name: games
    sql: '{CUBE}.games'
    type: number
  - name: wins
    sql: '{CUBE}.wins'
    type: number
  measures:
  - name: daily_games
    title: daily_games
    description: Sampled games of the hero over the days in scope.
    type: sum
    sql: '{CUBE}.games'
  - name: daily_wins
    title: daily_wins
    description: Of those, games won.
    type: sum
    sql: '{CUBE}.wins'
  - name: daily_win_rate
    title: daily_win_rate
    description: Wins divided by games over the selected days; null under 20 games (the minimum_games term), so
      a thin day or a rarely sampled hero cannot rank first.
    type: number
    sql: CASE WHEN {daily_games} >= 20 THEN {daily_wins} * 1.0 / NULLIF({daily_games}, 0) END
    format: percent
    meta:
      dst:
        better: higher
  segments:
  - name: trend
    sql: SUM({CUBE}.wins) * 1.0 / SUM({CUBE}.games)
    meta:
      dst:
        meaning: A hero's win rate over days, compared across two windows — rising, falling, or flat.
        aliases:
        - trending
        - rising
        - falling
        - going up
        - going down
        - this week vs last week
        - momentum
        term: trend
