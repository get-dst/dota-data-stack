cubes:
- name: items
  title: items
  description: Every item in the game's shop and neutral pool, with its price and the flags the item tables share
    — above all is_major_item, the finished items a build is planned around.
  sql_table: marts.dim_item
  meta:
    dst:
      grain: one row per item
      key:
      - item_id
      population: OpenDota's item constants for the current game version, internal and retired items included; not
        a record of purchases.
  dimensions:
  - name: item_id
    sql: '{CUBE}.item_id'
    type: number
    primary_key: true
    public: true
  - name: item_key
    sql: '{CUBE}.item_key'
    type: string
    description: Internal key, e.g. black_king_bar.
  - name: item_name
    sql: '{CUBE}.item_name'
    type: string
    description: 'Display name, e.g. Black King Bar. Not unique: the five Dagon levels, three Necronomicon levels
      and two Diffusal Blade levels share a name.'
  - name: item_cost
    sql: '{CUBE}.item_cost'
    type: number
    description: Shop price in gold; 0 for neutral items, enchantments and items with no shop price.
  - name: quality
    sql: '{CUBE}.quality'
    type: string
    description: OpenDota's item quality (component, rare, epic, consumable, artifact, common, secret_shop); not
      a reliable finished-or-component flag.
    meta:
      dst:
        dictionary:
        - component
        - rare
        - epic
        - consumable
        - artifact
        - common
        - secret_shop
        - consumable;laning
  - name: neutral_tier
    sql: '{CUBE}.neutral_tier'
    type: number
    description: Neutral item tier, 1 to 5; null for shop items and enchantments.
  - name: component_count
    sql: '{CUBE}.component_count'
    type: number
    description: Components the item is assembled from; 0 for items bought whole.
  - name: has_active_ability
    sql: '{CUBE}.has_active_ability'
    type: boolean
  - name: is_recipe
    sql: '{CUBE}.is_recipe'
    type: boolean
  - name: is_consumable
    sql: '{CUBE}.is_consumable'
    type: boolean
  - name: is_neutral
    sql: '{CUBE}.is_neutral'
    type: boolean
    description: True for neutral items and enchantments.
  - name: is_major_item
    sql: '{CUBE}.is_major_item'
    type: boolean
    description: 'True for a major item: at least 2000 gold, assembled from components or with its own active ability,
      not a recipe, consumable or neutral item.'
  measures:
  - name: item_count
    title: item_count
    description: Number of items.
    type: count
    sql: '{CUBE}.item_id'
  - name: avg_item_cost
    title: avg_item_cost
    description: Average shop price in gold.
    type: avg
    sql: '{CUBE}.item_cost'
