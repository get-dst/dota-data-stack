# dst overlay over the Cube model: everything dst-only that is not a member meta key.
# Generated by `dst migrate-model`; lenses = scope + policy over views.
version: 1
cubes:
  advantage_timeline:
    default_time_dimension: match_date
    use_cases:
    - Use for the average lead at a given minute (filter minute) across many matches, or how a single match swung.
    - Avoid for one number per match (the lead at 10/15/20/25, comebacks); that is match_leads.
    common_questions:
    - What was the average gold lead of the eventual winner at minute 15?
    - How did the gold advantage swing in match 9015048075?
  draft_phases:
    default_time_dimension: match_date
    use_cases:
    - Use for draft-order questions — what gets banned in the first phase, which heroes are first or last picked,
      how the first-pick side does, what a team bans.
    - Avoid for per-hero rates over a patch; hero_draft_stats already holds those counts per hero.
    - Avoid for win rates of heroes overall; pro matches outside Captains Mode are not here, hero_draft_stats and
      player rows cover those.
    common_questions:
    - Which heroes are banned most in the first ban phase on the current patch?
    - How often does the side with the first pick win?
    - Which heroes does Team Spirit ban most?
  farm_per_match:
    default_time_dimension: match_date
    use_cases:
    - Use for farm share by team, league, date or one match.
    - For rankings of heroes, positions or players use hero_playstyle or player_playstyle, which carry the games
      floor; hero_name and player_name are filters here, not groupings.
    common_questions:
    - Which team gives its carry the biggest share of farm at 10 minutes?
  fights_per_match:
    default_time_dimension: match_date
    use_cases:
    - Use for teamfight numbers by team, league or date, or for one match.
    - For rankings of heroes, positions or players use hero_playstyle or player_playstyle, which carry the games
      floor; hero_name and player_name are filters here, not groupings.
    common_questions:
    - Which team has the highest teamfight participation?
    - How many teamfights were there in match 9015110394?
  final_inventories:
    use_cases:
    - Use for neutral item and enchantment popularity (slot_group neutral or enchantment; neutral_tier for the tier),
      consumed Aghanim's Shard or Blessing, and backpack contents.
    - A consumed Aghanim's Scepter shows as Aghanim's Blessing in slot_group consumed; a held Scepter is in main
      or backpack.
    - When ranking by a rate, keep rows with at least 20 games (the minimum_games term).
    - Avoid for when an item was bought; that is item_timings or hero_core_items.
    common_questions:
    - Which neutral item do pros end the game with most often?
    - Which tier 5 neutral item has the best win rate?
    - Which enchantment is most popular in pro games?
    - Which heroes consume an Aghanim's Shard most often?
  hero_core_items:
    use_cases:
    - Use for "what do pros finish first on X", a hero's core build order, and when each core item lands.
    - Filter item_order = 'first' (item_slot 1) for the first major item, 'second' for the second, 'third' for the
      third.
    - When ranking by a rate, keep rows with at least 20 games (the minimum_games term) and report the game count
      with every rate.
    - Avoid for items bought at any point regardless of order; that is item_timings. Avoid for end-of-game inventories;
      that is final_inventories.
    common_questions:
    - What do pros finish first on Juggernaut?
    - What is Tusk's core build order in pro games?
    - Which heroes go Blink Dagger as their first major item most often?
    - When does Juggernaut complete his second core item?
  hero_daily_stats:
    default_time_dimension: match_date
    use_cases:
    - Use for hero pick, ban and win totals, and the day-by-day series behind them, over a period or a patch.
    - A hero's win rate over dates is period_win_rate (null under 20 picks); on one patch, hero_patch_trends answers
      from a smaller table. Avoid for anything about a specific player, team or position.
    common_questions:
    - Which heroes were picked most on the current patch?
    - How many times was Windranger banned this week?
  hero_draft_stats:
    use_cases:
    - Use for per-hero draft rates — contest rate, ban rate in the first phase, first-pick rate, last-pick rate,
      win rate by pick phase.
    - Rates here divide by drafted_matches or picks of the same hero; group by hero_name, since a rate summed over
      all heroes means nothing.
    - When ranking by a win rate, keep heroes with at least 20 picks (the minimum_games term) and report the pick
      count with the rate.
    - Avoid for anything about a team; that is draft_phases or team_signature_heroes.
    common_questions:
    - Which heroes were the most contested in pro drafts on the current patch?
    - Which heroes are first-picked most often?
    - What is Shadow Fiend's win rate when picked in the first pick phase?
  hero_item_builds:
    use_cases:
    - Use for what pros build on a hero and which items they win with.
    - Avoid for when an item was bought; that is item_timings.
    common_questions:
    - What do pros build on Juggernaut this patch?
    - How often does Ember Spirit end with a Black King Bar?
  hero_patch_trends:
    use_cases:
    - Use for a hero's pro pick, ban and win rate on a patch, and how they moved from the previous patch.
    - patch_win_rate is null under 20 picks (the minimum_games term), so a ranking lists only heroes past the floor;
      report the picks beside every rate.
    - Avoid for day-by-day numbers or a date range such as last month; that is hero_daily_stats. Avoid for a hero
      in one position; that is hero_position_meta.
    common_questions:
    - What is Pudge's pick rate on the current patch?
    - Which heroes gained the most pick rate since the previous patch?
    - Which hero has the highest ban rate on the current patch?
  hero_playstyle:
    use_cases:
    - 'Use for rankings and comparisons of heroes or positions by how they play: which hero fights most, farms most,
      wins its lane, creates space, wards most.'
    - Every rate here except the lane draw share is null under 10 games (the playstyle_minimum_games term), so a
      ranking lists only rows past the floor; report the games beside every rate.
    - Group by position for 'which position …' questions; filter a hero for one hero's numbers.
    - Avoid for named players; that is player_playstyle. Avoid for teams or single matches; those are the per-match
      entities (fights_per_match, farm_per_match, lanes_per_match, space_per_match, vision_per_match).
    common_questions:
    - Which hero has the highest fight participation as a position 4?
    - Which carry heroes win their lane most often?
    - Which heroes create the most space?
    - What share of the team's farm does a position 1 take at 10 minutes?
    - Which support places the most observer wards per game?
  hero_position_meta:
    use_cases:
    - Use for which position a hero is played in and how it fares there.
    - position_win_rate is null under 10 games in the position (the minimum_games floor for these thin rows), so
      a ranking lists only rows past the floor; report the games beside every rate.
    - Avoid for a hero's overall numbers regardless of position; that is hero_patch_trends.
    common_questions:
    - Which position is Pudge played in most?
    - What is Mirana's win rate as a position 4?
    - Which heroes are played as carry most often?
  item_timing_buckets:
    use_cases:
    - Use for win rate by item timing, e.g. "does an early Black King Bar win more on Ember Spirit?"
    - Sort windows by bucket_order, not by the label.
    - When comparing windows by win rate, report the game count of each; a window under 20 games is noise (minimum_games).
    - Avoid for the typical minute of an item; that is item_timings or hero_core_items.
    common_questions:
    - Does an early Black King Bar win more on Earth Spirit?
    - What is the win rate of Blink Dagger bought before 15 minutes?
    - In which timing window do pros finish Battle Fury on Anti-Mage?
  item_timings:
    use_cases:
    - Use for "when do pros buy X on Y" and which items a hero rushes.
    - Avoid for what a hero ends the game holding; that is hero_item_builds.
    - Avoid for the order items are completed in (a hero's first, second or third major item); this table has no
      order.
    common_questions:
    - When do pros buy Black King Bar on Juggernaut?
    - What does Anti-Mage rush this patch?
  items:
    use_cases:
    - Use for what an item costs, which items count as major items, and which neutral items sit in which tier.
    - Avoid for how often an item is bought or held; that is hero_core_items, item_timing_buckets, starting_items
      or final_inventories.
    common_questions:
    - Which major items cost more than 5000 gold?
    - Which neutral items are tier 5?
    - How much does Black King Bar cost?
  lane_matchups:
    use_cases:
    - Use for lane matchups in pro play — how a hero does in lane against a named enemy hero, which heroes win the
      lane against a given hero.
    - lane_name is the hero's own lane, relative to its side; the opponent stood in the mirror lane of the same
      stretch of map, so a safe-lane hero's opponents are off-lane heroes and mid meets mid. "Offlane heroes against
      X" is lane_name 'off lane' with opponent_hero_name X.
    - A lane win is the lane_outcome term, the hero's side more than 400 gold ahead of the enemy laners at minute
      10; the result belongs to the side, so a 2v2 lane gives a hero one row per opponent with the same result.
    - When ranking by a rate, keep rows with at least 20 games (the minimum_games term) and report the game count
      with every rate; a named matchup under the floor gets its counts and the note that the rate is withheld.
    - Avoid for a hero's lane record over all opponents (hero_playstyle), for heroes on the same side (lane pairs,
      on the drafts lens) and for whole-match counters (pro_draft_matchups there).
    common_questions:
    - Which offlane heroes win the lane most often against Juggernaut this patch?
    - How does Sven do in lane against Tiny?
  lane_pairings:
    use_cases:
    - Use for lane partners in pro play — which support a carry laned with, which pairs win their games.
    - lane_name is relative to the side (safe lane, mid, off lane); a Radiant bottom pair and a Dire top pair are
      both safe-lane pairs.
    - When ranking by a rate, keep rows with at least 20 games (the minimum_games term) and report the game count
      with every rate.
    - Avoid for heroes on the same team regardless of lane; this counts only heroes that laned together.
    common_questions:
    - Which supports lane most with Shadow Fiend in the safe lane?
    - Which safe-lane pairs win the most in pro matches this patch?
  lanes_per_match:
    default_time_dimension: match_date
    use_cases:
    - Use for lane results by team, league, date or one match, and for a hero's lane against a specific lane.
    - For rankings of heroes, positions or players use hero_playstyle or player_playstyle, which carry the games
      floor; hero_name and player_name are filters here, not groupings.
    common_questions:
    - Which team wins its lanes most often?
    - How did the mid lane go in match 9015110394?
  league_standings:
    use_cases:
    - Use for who is winning a tournament, a team's record in an event.
    - Avoid for two teams against each other; that is team_head_to_head.
    common_questions:
    - Who has the best record in PGL Wallachia?
    - How many matches has Team Spirit won in the current league?
  match_leads:
    default_time_dimension: match_date
    use_cases:
    - Use for how often the early leader wins, comebacks and throws, and one match's leads at 10, 15, 20 and 25
      minutes.
    - Avoid for a minute-by-minute curve or the average lead at a minute; that is advantage_timeline.
    common_questions:
    - How often does the team ahead at 20 minutes win?
    - How many comebacks were there on the current patch?
    - Which team threw the most games?
    - What was the biggest comeback this month?
  match_objectives:
    default_time_dimension: match_date
    use_cases:
    - Use for when first objectives happen, who took them, and Roshan and Aegis counts.
    - Avoid for how often taking a first objective wins; that is objective_win_rates.
    common_questions:
    - When is Roshan first killed on average?
    - How many Roshan kills does a pro match have on average?
    - Which side takes the first Roshan more often?
  objective_win_rates:
    use_cases:
    - Use to compare which first objective predicts the winner best, per patch.
    - Avoid for timings or per-match detail; that is match_objectives.
    common_questions:
    - Which first objective has the highest win rate?
    - How often does the team that kills Roshan first win on the current patch?
  patch_notes:
    use_cases:
    - Use for what changed for a hero or item in a patch.
    - Avoid for numbers about matches; the notes are text.
    - Lettered patches (7.40b, 7.40c) carry their own notes and have no row in patches; the latest patch's notes
      join on its patch_name.
    common_questions:
    - What changed for Pudge in 7.41?
    - Which items were changed in the latest patch?
  player_performances:
    default_time_dimension: match_date
    use_cases:
    - Use for player stats (GPM, XPM, KDA, kills), a named pro's heroes and win rate, rankings of players, and heroes
      filtered to one role (carries, mids, pos 4).
    - Avoid for a hero's numbers regardless of role; hero_patch_trends (per patch) and hero_daily_stats (per date)
      hold them in far smaller tables.
    - Filter position_name (carry, mid, offlane, soft support, hard support) for questions about the players of
      one role.
    - Win rate is null under 20 player-games and the averages are null under 10 (the minimum_games term), so a ranking
      lists only rows past the floor; report the games beside every rate.
    - Avoid for a team's matches, wins or win rate; those are team_matches. Avoid for match-level facts (duration,
      winner) — those repeat ten times here; use pro_matches.
    common_questions:
    - Which carry heroes have the highest win rate on the current patch?
    - Who has the highest average GPM this month?
    - Who is the best mid player on the current patch?
    - Which heroes does Yatoro play most?
  player_playstyle:
    use_cases:
    - Use for rankings and comparisons of named pro players by how they play.
    - Every rate here except the lane draw share is null under 10 games (the player_minimum_games term), so a ranking
      lists only players past the floor; report the games beside every rate.
    - Filter main_position to compare players of one role.
    - Avoid for heroes or positions in general; that is hero_playstyle.
    common_questions:
    - Which pro player has the highest lane win rate on the current patch?
    - Which hard support players place the most observer wards per game?
    - Which offlane players absorb the most damage per minute?
    - Which position 5 player places the most wards per game?
    - Which player dies least outside teamfights?
  pro_draft_matchups:
    use_cases:
    - Use for pro matchups and counters — how a hero does against a specific opponent in pro play.
    - When ranking by a rate, keep rows with at least 20 games (the minimum_games term) and report the game count
      with every rate.
    - Avoid for public matchmaking matchups; this is pro play only.
    common_questions:
    - How does Ember Spirit do against Dark Seer in pro matches?
    - Which heroes does Shadow Fiend struggle against in pro matches this patch?
  pro_matches:
    default_time_dimension: match_date
    use_cases:
    - Use for match counts, durations, kill totals, and the Radiant or Dire side's record.
    - Avoid for a team's matches, wins or win rate; those are team_matches. Avoid for per-hero or per-player questions;
      those live on player_performances and drafts.
    common_questions:
    - How many pro matches were played this week?
    - What is the average match duration on the current patch?
    - How often does the Radiant side win on the current patch?
  pub_duos:
    use_cases:
    - duo_win_rate is null under 20 games (the minimum_games term), so a ranking lists only pairs past the floor;
      report the game count with every rate.
    - Use for which heroes win together — lane partners, synergies.
    - Avoid for opponents; that is pub_matchups.
    common_questions:
    - Which heroes pair best with Crystal Maiden?
    - Is Io and Tiny still a good combo?
  pub_hero_by_duration:
    use_cases:
    - Use for whether a hero wins more in long or short games.
    - bucket_win_rate is null under 20 games (the minimum_games term), so a ranking lists only heroes past the floor
      in that bucket; report the game count with every rate.
    - Avoid for overall win rate; that is pub_hero_stats.
    common_questions:
    - Does Anti-Mage win more in games over 45 minutes?
    - Which heroes are best in short games?
    - Which heroes are best in games under 25 minutes at Legend?
  pub_hero_stats:
    use_cases:
    - hero_win_rate is null under 20 games (the minimum_games term), so a ranking by it lists only heroes past the
      floor; report the game count with every rate.
    - Use for hero win rate and pick rate in pubs, by bracket and patch.
    - Avoid for hero-versus-hero or hero-with-hero questions; those are pub_matchups and pub_duos.
    common_questions:
    - Which heroes have the highest win rate at Legend this patch?
    - What is Pudge's win rate at Herald?
    - Which heroes are picked most at Immortal?
  pub_hero_trends:
    default_time_dimension: match_date
    use_cases:
    - Use for a hero's win rate over time, this week versus last week.
    - Avoid for a single overall number; that is pub_hero_stats.
    common_questions:
    - Is Pudge's win rate going up this week?
    - How has Invoker trended since the patch?
  pub_matches:
    default_time_dimension: match_date
    use_cases:
    - Use for how many public matches the sample holds, game length by bracket, and the Radiant win rate in pubs.
    - Avoid for anything per hero; that is pub_hero_stats, pub_matchups and pub_duos.
    common_questions:
    - How long is an average ranked game at Divine?
    - What is the Radiant win rate in ranked pubs this patch?
  pub_matchups:
    use_cases:
    - matchup_win_rate is null under 20 games (the minimum_games term), so a ranking lists only matchups past the
      floor; report the game count with every rate.
    - Use for counters and matchups — how a hero does against a specific opponent.
    - Avoid for allies; that is pub_duos.
    common_questions:
    - Who counters Invoker this patch?
    - How does Anti-Mage do against Phantom Lancer?
  space_per_match:
    default_time_dimension: match_date
    use_cases:
    - Use for the space proxy by team, league, date or one match.
    - For rankings of heroes, positions or players use hero_playstyle or player_playstyle, which carry the games
      floor; hero_name and player_name are filters here, not groupings.
    - 'It is a declared proxy (the space_created term): say so when answering.'
    common_questions:
    - Which team's offlaners absorb the most damage?
  starting_builds:
    use_cases:
    - Use for the most common or best-winning complete starting build on a hero.
    - Avoid for single starting items; that is starting_items.
    common_questions:
    - What is the most common starting build on Pudge?
    - Which starting build wins most on Juggernaut?
  starting_items:
    use_cases:
    - Use for starting items, laning purchases before the horn, and which heroes start with a given item.
    - For "what do pros start with on X", rank the hero's items by starting_games and give the count beside each.
    - Avoid for the whole starting build as one line; that is starting_builds.
    common_questions:
    - What do pros start with on Pudge?
    - Which heroes start with a Quelling Blade most often?
    - How many Iron Branches do pros start with on Pudge?
  team_head_to_head:
    use_cases:
    - Use for how one team has done against another.
    - Avoid for a team's overall record, match count or win rate; that is team_matches.
    common_questions:
    - How has Team Spirit done against Team Liquid this patch?
  team_lineups:
    default_time_dimension: match_date
    use_cases:
    - Use for what a team drafted — its lineups, which carry or mid it plays most, how a lineup did.
    - Avoid for hero counts across all teams; that is hero_draft_stats.
    common_questions:
    - Which carry heroes does BETBOOM TEAM play most?
    - What lineups has Team Spirit played on the current patch?
  team_matches:
    default_time_dimension: match_date
    use_cases:
    - Use for how many matches a team played, how many it won, its win rate, and its record over a period, a patch
      or a league.
    - Use for month-over-month or patch-over-patch comparisons of one team.
    - Avoid for two named teams against each other; that is team_head_to_head. Avoid for the players on the team;
      that is player_performances.
    common_questions:
    - How many matches did Team Liquid play in August 2026?
    - How did Team Spirit do on the current patch?
    - Which team has the highest win rate on the current patch?
    - Which team has won the most matches this month?
  team_signature_heroes:
    use_cases:
    - Use for a team's most-played heroes (rank by team_hero_games) and its signature heroes (the signature_hero
      term).
    - team_pick_rate, field_pick_rate and pick_rate_lift are per-row values for one patch; the signature_lift metric
      reads them within a patch.
    - Avoid for heroes across all teams; that is hero_draft_stats.
    common_questions:
    - What are Team Spirit's most played heroes on the current patch?
    - What are Team Falcons' signature heroes?
  teams:
    use_cases:
    - Use for a team's rating, tag and all-time record, and for how many teams there are.
    - Avoid for a team's matches, wins or win rate in the loaded window; that is team_matches.
  vision_per_match:
    default_time_dimension: match_date
    use_cases:
    - Use for wards, runes and buybacks by team, league, date or one match.
    - For rankings of heroes, positions or players use hero_playstyle or player_playstyle, which carry the games
      floor; hero_name and player_name are filters here, not groupings.
    common_questions:
    - Which team places the most observer wards per game?
    - Which rune type do mids take most?
lenses:
  drafts:
    owner: dota-data-stack
    timezone: UTC
    stale_after_days: 2
    not_computable:
    - measure: draft reasoning
      aliases:
      - why did
      - why do
      - why does
      - why would
      - reason for
      - reasoning
      - intent
      - intention
      - strategy behind
      - mindset
      reason: the draft log records which hero was picked or banned and in what order, not why; how often a hero
        is picked, banned or wins is answerable, the reason behind a choice is not
    - measure: predictions
      aliases:
      - prediction
      - predictions
      - predict
      - who will win
      - will win
      - going to win
      - odds
      - forecast
      - next patch
      reason: the drafts here were already made; nothing here says what teams will pick or who will win
    - measure: MMR
      aliases:
      - rank
      - skill bracket
      - rating of players
      - medal
      reason: professional matches carry no matchmaking rating; only teams have an OpenDota rating
    - measure: draft timing
      aliases:
      - time per pick
      - reserve time
      - how long the draft took
      - pick timer
      - seconds per ban
      reason: OpenDota's draft log records the order of picks and bans, not when each was made or how much reserve
        time was used
    - measure: public matchmaking
      aliases:
      - pubs
      - pub games
      - public matches
      - ranked matchmaking
      - pub bans
      - pub drafts
      - bans in public matchmaking
      - turbo
      route_to: pub_meta
      reason: only professional matches have drafts and bans here; public games carry no draft, and pub hero stats
        are answered separately
    - measure: personal match history
      aliases:
      - my matches
      - my win rate
      - my account
      - my games
      - my drafts
      - steam id
      - steam account
      - account id
      - dotabuff profile
      reason: only professional matches are here, not any individual player's public history
    - measure: tier-3 leagues
      aliases:
      - tier 3
      - tier-3
      - tier three
      - excluded leagues
      - amateur leagues
      - Destiny League
      - Dota 2 Space League
      reason: professional matches here are those in leagues OpenDota rates premium or professional; its tier-3
        leagues such as Destiny League, Dota 2 Space League and Ultras Dota Pro League 2025-26 are left out of every
        answer
    access:
      allow:
      - group: demo
      - group: everyone
    eval_gate: block
    definitions:
    - first_phase
    - first_pick
    - last_pick
    - contest_rate
    - signature_hero
    - lane_pair
    - pro_counter
    - current_patch
    - pro_match
    - minimum_games
    views:
    - drafts_lens
    - drafts_draft_phases
    - drafts_hero_draft_stats
    - drafts_lane_pairings
    - drafts_pro_draft_matchups
    - drafts_team_lineups
    - drafts_team_signature_heroes
  items:
    owner: dota-data-stack
    timezone: UTC
    stale_after_days: 2
    not_computable:
    - measure: items in public matches
      aliases:
      - pub builds
      - pubs
      - public matches
      - ranked pubs
      - matchmaking
      - my bracket
      - turbo
      - turbo mode
      - in my games
      reason: the public match feed carries no items; everything about items here comes from professional matches
    - measure: a named player's item builds
      aliases:
      - player build
      - what does a pro player build
      - personal build
      - my build
      - my items
      reason: items here are counted per hero and patch, with no player identity
    - measure: items against a named enemy hero
      aliases:
      - against
      - counter
      - counter-itemize
      - itemize against
      - when the enemy has
      - enemy team has
      reason: items here are counted per hero and patch, with no enemy lineup; what pros buy against a named enemy
        is not recorded
    - measure: item activations
      aliases:
      - item uses
      - how many times an item was used
      - times activated
      - activated
      - activation
      - activations
      - times used
      - cast count
      reason: the match records loaded here carry what was bought and held, not how often an item was used
    - measure: neutral item timing
      aliases:
      - when a neutral item drops
      - neutral item drop
      - neutral drop
      - get their neutral
      - get their tier 1 neutral
      - get their tier 2 neutral
      - get their tier 3 neutral
      - get their tier 4 neutral
      - get their tier 5 neutral
      - neutral item minute
      - neutral item timing
      - neutral timing
      reason: neutral items are found, not bought, so the purchase log has no time for them; only the neutral held
        at game end is recorded
    - measure: MMR
      aliases:
      - medal
      - skill bracket
      - matchmaking rating
      reason: professional matches carry no matchmaking rating
    - measure: tier-3 leagues
      aliases:
      - tier 3 league
      - tier 3 leagues
      - tier three leagues
      - tier-3 league
      - excluded leagues
      - amateur leagues
      - Destiny League
      - Dota 2 Space League
      reason: professional matches here are those in leagues OpenDota rates premium or professional; its tier-3
        leagues such as Destiny League, Dota 2 Space League and Ultras Dota Pro League 2025-26 are left out of every
        answer
    access:
      allow:
