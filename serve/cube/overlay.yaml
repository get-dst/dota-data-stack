definitions:
- metric: bracket
  about: pub_hero_stats.bracket_name
  summary: The rank bracket of a public match, from the average rank tier of its ten players.
  aliases:
  - rank bracket
  - skill bracket
  - medal
  - rank tier
  - Herald
  - Guardian
  - Crusader
  - Archon
  - Legend
  - Ancient
  - Divine
  - Immortal
  file: semantic/definitions/bracket.md
- metric: contest_rate
  about: hero_draft_stats.contest_rate
  summary: Share of pro matches in which a hero was picked or banned.
  aliases:
  - contested
  - pick+ban rate
  - presence
  file: semantic/definitions/contest_rate.md
- metric: core_item
  about: hero_core_items.item_slot
  summary: A hero's core items are the first three major items finished in a game, in order; "first item" means
    item_order = 'first' (item_slot 1) on hero_core_items.
  aliases:
  - core build
  - core items
  - build order
  - item order
  - first item
  - second item
  - third item
  - first major item
  - rush item
  file: semantic/definitions/core_item.md
- metric: major_item
  about: items.is_major_item
  summary: A finished item a build is planned around — at least 2000 gold, assembled from components or with its
    own active ability, and not a recipe, consumable or neutral item.
  aliases:
  - big item
  - core item purchase
  - finished item
  - completed item
  - luxury item
  - major items
  file: semantic/definitions/major_item.md
- metric: minimum_games
  summary: A rate over fewer than 20 games is noise. The win-rate metrics return null under 20 games (10 on the
    thin per-position, per-player and per-league rows), so a small sample cannot top a ranking; every rate is reported
    with its game count.
  aliases:
  - sample size
  - enough games
  - small sample
  - at least N games
  file: semantic/definitions/minimum_games.md
- metric: player_minimum_games
  summary: A player's playstyle rates are null under 10 games on the patch, so a one-game player cannot top a ranking;
    the games are reported beside every rate.
  aliases:
  - enough games
  - sample size
  - player floor
  file: semantic/definitions/player_minimum_games.md
- metric: playstyle_minimum_games
  summary: A hero-and-position playstyle rate is null under 10 games on the patch, so a one-game row cannot top
    a ranking; the games are reported beside every rate.
  aliases:
  - enough games
  - sample size
  - playstyle floor
  file: semantic/definitions/playstyle_minimum_games.md
- metric: playstyle_position
  about: hero_playstyle.position_name
  summary: A player's role in a match, 1 to 5, on the playstyle entities — 1 carry, 2 mid, 3 offlane, 4 soft support,
    5 hard support; a question about carries, mids, offlaners or supports filters on it.
  aliases:
  - role
  - pos
  - carry
  - carries
  - mid
  - mids
  - midlaner
  - midlaners
  - mid players
  - offlane
  - offlaner
  - offlaners
  - support
  - supports
  - hard support
  - hard supports
  - soft support
  - soft supports
  - pos 1
  - pos 2
  - pos 3
  - pos 4
  - pos 5
  - position 1
  - position 2
  - position 3
  - position 4
  - position 5
  file: semantic/definitions/playstyle_position.md
- metric: position
  about: player_performances.position_name
  summary: A pro player's role in a match, 1 to 5, derived from lane and farm — 1 carry, 2 mid, 3 offlane, 4 soft
    support, 5 hard support; a question about carries, mids, offlaners or supports filters on it.
  aliases:
  - role
  - pos
  - carry
  - carries
  - mid
  - midlaner
  - midlaners
  - offlane
  - offlaner
  - offlaners
  - support
  - supports
  - hard support
  - soft support
  - pos 1
  - pos 2
  - pos 3
  - pos 4
  - pos 5
  file: semantic/definitions/position.md
- metric: pro_match
  summary: A professional match in a league OpenDota rates premium or professional; leagues it rates below professional
    are not counted.
  aliases:
  - professional match
  - pro game
  - tournament match
  file: semantic/definitions/pro_match.md
- metric: public_sample
  summary: The public-match numbers come from a sample, the newest games OpenDota listed at each load, not from
    every game played.
  aliases:
  - pubs
  - public matches
  - matchmaking
  - ranked games
  - pub games
  file: semantic/definitions/public_sample.md
- metric: starting_build
  summary: What a player buys before the horn — every purchase at or before 0:00 on the game clock.
  aliases:
  - starting items
  - starting build
  - start items
  - pre-game items
  - laning items bought at the start
  - what to start with
  file: semantic/definitions/starting_build.md
- metric: tournament_winner
  summary: The team that won a league or tournament is the winner of its last match, the deciding game of the final;
    the team with the most wins in the standings is not necessarily it.
  aliases:
  - tournament winner
  - champion
  - champions
  - won the tournament
  - won the league
  - won the event
  - grand final
  - grand finals
  file: semantic/definitions/tournament_winner.md
