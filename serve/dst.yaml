name: dota

providers:
  # Generation and prose: a fast OpenAI-compatible model. Key in .env.
  deepseek:
    type: openai-compatible
    base_url: https://api.deepseek.com
    api_key_env: DST_API_KEY_DEEPSEEK
    fast_model: deepseek-v4-flash
  # Typed decisions: no model writes SQL for a typed answer — every slot is a
  # closed-set decision over the semantic model, and the SQL is compiled.
  jev:
    type: typesafe
    api_key_env: DST_API_KEY_JEV
  # Certified-answer matching and routing. In-process, no key: the server needs
  # `pip install 'dst-core[local-embed]'`. Swap for an openai-compatible entry with
  # embedding_model in production.
  embed:
    type: local

connections:
  # The marts dbt built, on MotherDuck. The connection opens read-only under any token;
  # a read-scaling token (MotherDuck's SELECT-only credential) is the one to serve with.
  # Local instead: {type: duckdb, config: {path: ../data/dota.duckdb, schema: marts,
  #                 statement_timeout_ms: 30000}}
  # Postgres: {type: postgres, config: {host: …, port: 5432, database: …, user: dst_ro,
  #            schema: marts, sslmode: require, statement_timeout_ms: 30000}, secret_env: …}
  warehouse:
    type: duckdb
    config: {path: md:dota, schema: marts, statement_timeout_ms: 30000}
    secret_env: DST_API_KEY_WAREHOUSE

# The public demo's page: one sentence, the privacy page, and an example exchange whose
# figures come from the demo's own answers (data as of 26 September 2026).
demo:
  tagline: Ask about a year of pro Dota 2 from Claude, ChatGPT or any AI you use.
  privacy_url: https://www.dataservetool.com/privacy/
  log_days: 30
  audience: consumer
  example:
    - user: I want to learn a carry this patch. What's strong?
    - tool: asked roshan — which carry heroes win their lane most often on the current patch?
    - tool: asked roshan — which heroes are contested most in pro drafts on the current patch?
    - assistant: "Shadow Fiend stands out: pro carries on him win their lane 59.1% of the time this patch, ahead of Magnus (54.5%) and Drow Ranger (51.0%). In pro drafts the most fought-over heroes are Puck, Hoodwink and Lone Druid (2,068, 1,916 and 1,866 picks plus bans), so expect Lone Druid to go early."
    - user: And what's Yatoro's MMR?
    - tool: asked roshan — no MMR in pro match data
    - assistant: roshan can't answer that. Pro matches carry no matchmaking rating.
