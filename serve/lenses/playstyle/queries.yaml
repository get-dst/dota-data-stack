use_when:
  - how professional players and heroes play, from OpenDota's parsed pro matches — teamfight
    participation, deaths inside and outside fights, farm share and farm priority, lane
    results at 10 minutes, the space-created proxy (damage absorbed from enemy heroes,
    traded deaths), wards, runes and buybacks
  - "which hero or player wins its lane, who creates space, which position farms most, who
    wards most, how often a hero shows up to fights, which team wins its lanes"
  - hero against hero in the same lane — how a hero does in lane against a named enemy
    hero, which heroes win the lane against it
  - not for win rates, GPM, KDA, picks, bans or drafts — those have their own lenses
sample_queries:
  - question: Which carry heroes win their lane most often on the current patch?
    sql: |
      SELECT hero_playstyle.hero_name,
             SUM(hero_playstyle.games) AS games,
             CASE WHEN SUM(hero_playstyle.games) >= 10
                  THEN SUM(hero_playstyle.lanes_won) * 1.0 / NULLIF(SUM(hero_playstyle.lane_games), 0) END AS lane_win_rate
      FROM marts.hero_playstyle AS hero_playstyle
      JOIN marts.dim_patch AS patches ON patches.patch_id = hero_playstyle.patch_id
      WHERE patches.is_current = TRUE AND hero_playstyle.position = 1
      GROUP BY hero_playstyle.hero_name
      ORDER BY lane_win_rate DESC NULLS LAST
      LIMIT 10
  - question: What share of the side's gold does each position take at 10 minutes?
    sql: |
      SELECT hero_playstyle.position,
             SUM(hero_playstyle.farm_games_10) AS games,
             SUM(hero_playstyle.farm_share_10_total) / SUM(hero_playstyle.farm_games_10) AS farm_share_10
      FROM marts.hero_playstyle AS hero_playstyle
      GROUP BY hero_playstyle.position
      ORDER BY hero_playstyle.position
  - question: Which hard support players place the most observer wards per game?
    sql: |
      SELECT player_playstyle.player_name,
             SUM(player_playstyle.games) AS player_games,
             CASE WHEN SUM(player_playstyle.games) >= 10
                  THEN SUM(player_playstyle.observers_placed) * 1.0 / SUM(player_playstyle.games) END AS player_observers_per_game
      FROM marts.player_playstyle AS player_playstyle
      WHERE player_playstyle.main_position = 5
      GROUP BY player_playstyle.player_name
      ORDER BY player_observers_per_game DESC NULLS LAST
      LIMIT 10
  - question: Which team places the most observer wards per game?
    sql: |
      SELECT vision_per_match.team_name,
             COUNT(DISTINCT vision_per_match.match_id) AS matches,
             CASE WHEN COUNT(DISTINCT vision_per_match.match_id) >= 20
                  THEN SUM(vision_per_match.observers_placed) * 1.0 / COUNT(DISTINCT vision_per_match.match_id) END AS team_observers_per_match
      FROM marts.vision_and_runes AS vision_per_match
      WHERE vision_per_match.team_name IS NOT NULL
      GROUP BY vision_per_match.team_name
      ORDER BY team_observers_per_match DESC NULLS LAST
      LIMIT 10
