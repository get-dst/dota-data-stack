# Certified answers: question -> SQL pairs a person checked. Served verbatim, re-verified
# on every apply and by `dst test`. Tie-free shapes only: a top-N with ties at the edge
# cannot be compared as a set.
- question: How many ranked matches are in the sample on the current patch?
  sql: |
    SELECT COUNT(*) AS match_count
    FROM marts.fact_pub_match AS pub_matches
    JOIN marts.dim_patch AS patches ON patches.patch_id = pub_matches.patch_id
    WHERE pub_matches.game_type = 'ranked_all_pick' AND patches.is_current = TRUE
  status: active
- question: What is the Radiant win rate in ranked matches on the current patch?
  sql: |
    SELECT SUM(CASE WHEN radiant_win THEN 1 ELSE 0 END) * 1.0 / COUNT(*) AS radiant_win_rate
    FROM marts.fact_pub_match AS pub_matches
    JOIN marts.dim_patch AS patches ON patches.patch_id = pub_matches.patch_id
    WHERE pub_matches.game_type = 'ranked_all_pick' AND patches.is_current = TRUE
  status: active
- question: How many distinct heroes appear in the ranked sample on the current patch?
  sql: |
    SELECT COUNT(DISTINCT hero_id) AS heroes_seen
    FROM marts.pub_hero_stats AS pub_hero_stats
    JOIN marts.dim_patch AS patches ON patches.patch_id = pub_hero_stats.patch_id
    WHERE pub_hero_stats.game_type = 'ranked_all_pick' AND patches.is_current = TRUE
  status: active
