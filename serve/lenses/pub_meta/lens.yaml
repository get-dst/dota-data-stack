name: pub_meta
display_name: Dota 2 pub meta
description: Hero win rates, counters and duos by rank bracket, from a sample of public
  ranked matches on OpenDota.
owner: dota-data-stack
# Match dates are UTC dates; the business day is UTC.
timezone: UTC
# The loader runs every four hours; two days without new sampled games is stale.
stale_after_days: 2
connections: [warehouse]
select:
  entities:
    - pub_matches
    - pub_hero_stats
    - pub_matchups
    - pub_duos
    - pub_hero_trends
    - pub_hero_by_duration
    - heroes
    - patches
    - brackets
  definitions:
    - bracket
    - counter
    - synergy
    - public_sample
    - pub_pick_rate
    - minimum_games
    - trend
    - current_patch
not_computable:
  - measure: Turbo and unranked games
    aliases: [turbo, turbo mode, unranked, unranked games, normal matchmaking, casual games]
    reason: everything here counts ranked All Pick only; Turbo and unranked games are a different game from ranked and are kept out of every answer
  - measure: MMR
    aliases: [MMR, matchmaking rating, average MMR, MMR bracket]
    reason: the public feed carries each match's average rank tier (the bracket, Herald to Immortal), not any player's matchmaking rating
  - measure: predictions
    aliases: [prediction, predictions, predict, next patch, forecast]
    reason: the sample holds games already played; it cannot say how heroes will do after a change that has not happened
  - measure: personal match history
    aliases: [my matches, my win rate, my account, my games, steam id, steam account, account id, dotabuff profile, a specific player]
    reason: the public sample carries no player identities, only heroes and outcomes
  - measure: items in pubs
    aliases: [item build, builds, what to buy, purchase]
    route_to: items
    reason: the public feed carries no items; professional item builds are answered separately
  - measure: positions in pubs
    aliases: [role, lane, carry, mid, offlane, support]
    route_to: pro_meta
    reason: the public feed carries no lane data; positions exist only for pro matches
  - measure: ban rate in pubs
    aliases: [bans, banned]
    route_to: drafts
    reason: the public feed carries picks only; bans exist only for pro matches
eval_gate: block
# Typed first; a question that does not type falls to raw SQL, disclosed UNTYPED.
untyped_fallback: true
access:
  allow:
    - {group: demo}
    - {group: everyone}
rate_limit:
  per_caller_rpm: 60
  per_caller_rpd: 50
