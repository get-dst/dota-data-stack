name: pro_players
display_name: Dota 2 pro players
description: Professional players and their performances — who plays what, how well, for
  which team, from OpenDota's pro matches.
owner: dota-data-stack
timezone: UTC
stale_after_days: 2
connections: [warehouse]
select:
  entities:
    - player_performances
    - pro_players
    - pro_matches
    - heroes
    - patches
    - teams
    - leagues
  definitions:
    - position
    - hero_win_rate
    - team_win_rate
    - current_patch
    - pro_match
    - minimum_games
not_computable:
  - measure: MMR
    aliases: [rank, medal, skill bracket, leaderboard rank]
    reason: professional matches carry no matchmaking rating
  - measure: earnings
    aliases: [prize money, winnings, salary]
    reason: OpenDota's match feed carries no money
  - measure: personal match history
    aliases: [my matches, my win rate, my account, my games, steam id]
    reason: this lens holds professional players only, not any individual account's public games
access:
  allow:
    - {group: demo}
    - {group: everyone}
rate_limit:
  per_caller_rpm: 60
  per_caller_rpd: 50

# Typed first; a question that does not type falls to raw SQL, disclosed UNTYPED.
untyped_fallback: true
