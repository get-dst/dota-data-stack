name: pro_players
display_name: Dota 2 pro players
description: Professional players and their performances — who plays what, how well, for
  which team, from OpenDota's pro matches.
owner: dota-data-stack
timezone: UTC
stale_after_days: 2
connections: [warehouse]
select:
  entities:
    - player_performances
    - pro_players
    - pro_matches
    - heroes
    - patches
    - teams
    - leagues
  definitions:
    - position
    - hero_win_rate
    - current_patch
    - pro_match
    - minimum_games
not_computable:
  - measure: MMR
    aliases: [rank, medal, skill bracket, leaderboard rank]
    reason: professional matches carry no matchmaking rating
  - measure: earnings
    aliases: [prize money, winnings, salary]
    reason: OpenDota's match feed carries no money
  - measure: personal match history
    aliases: [my matches, my win rate, my account, my games, steam id]
    reason: this lens holds professional players only, not any individual account's public games
  - measure: tier-3 leagues
    aliases: [tier 3, tier-3, tier three, excluded leagues, amateur leagues, Destiny League, Dota 2 Space League]
    reason: professional matches here are those in leagues OpenDota rates premium or professional; matches in leagues it rates excluded, its tier-3 leagues such as Destiny League, Dota 2 Space League and Ultras Dota Pro League 2025-26, stay in the raw tables and reach no table in this lens
access:
  allow:
    - {group: demo}
    - {group: everyone}
rate_limit:
  per_caller_rpm: 60
  per_caller_rpd: 50

eval_gate: block

# Typed first; a question that does not type falls to raw SQL, disclosed UNTYPED.
untyped_fallback: true
