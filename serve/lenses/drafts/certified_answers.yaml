# Certified answers: question -> SQL pairs a person checked. Served verbatim, re-verified
# on every apply and by `dst test`.
- question: How often does the side with the first pick win in pro drafts?
  sql: |
    SELECT SUM(CASE WHEN draft_phases.side_won THEN 1 ELSE 0 END) * 1.0 / COUNT(*) AS first_pick_side_win_rate
    FROM marts.draft_phases AS draft_phases
    WHERE draft_phases.is_first_pick = TRUE
  status: active
- question: What is Treant Protector's contest rate in pro drafts on the current patch?
  sql: |
    SELECT SUM(hero_draft_stats.contests) * 1.0 / SUM(hero_draft_stats.drafted_matches) AS contest_rate
    FROM marts.hero_draft_stats AS hero_draft_stats
    JOIN marts.dim_patch AS patches ON patches.patch_id = hero_draft_stats.patch_id
    WHERE patches.is_current = TRUE AND hero_draft_stats.hero_name = 'Treant Protector'
  status: active
- question: How many times was Shadow Fiend the first pick in pro drafts?
  sql: |
    SELECT SUM(hero_draft_stats.first_picks) AS hero_first_picks
    FROM marts.hero_draft_stats AS hero_draft_stats
    WHERE hero_draft_stats.hero_name = 'Shadow Fiend'
  status: active
