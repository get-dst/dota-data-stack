name: drafts
display_name: Dota 2 pro drafts
description: Picks, bans, draft phases, matchups, lane pairs and team lineups in
  professional Dota 2 matches from OpenDota.
owner: dota-data-stack
# Match dates are UTC dates; the business day is UTC.
timezone: UTC
# The loader runs every four hours; two days without new matches is stale.
stale_after_days: 2
connections: [warehouse]
select:
  entities:
    - hero_draft_stats
    - draft_phases
    - pro_draft_matchups
    - lane_pairings
    - team_lineups
    - team_signature_heroes
    - heroes
    - patches
    - teams
  definitions:
    - first_phase
    - first_pick
    - last_pick
    - contest_rate
    - signature_hero
    - lane_pair
    - pro_counter
    - current_patch
    - pro_match
    - minimum_games
not_computable:
  - measure: draft reasoning
    aliases: [why did, why do, why does, why would, reason for, reasoning, intent, intention, strategy behind, mindset]
    reason: the draft log records which hero was picked or banned and in what order, not why; how often a hero is picked, banned or wins is answerable, the reason behind a choice is not
  - measure: predictions
    aliases: [prediction, predictions, predict, who will win, will win, going to win, odds, forecast, next patch]
    reason: the drafts here were already made; nothing here says what teams will pick or who will win
  - measure: MMR
    aliases: [rank, skill bracket, rating of players, medal]
    reason: professional matches carry no matchmaking rating; only teams have an OpenDota rating
  - measure: draft timing
    aliases: [time per pick, reserve time, how long the draft took, pick timer, seconds per ban]
    reason: OpenDota's draft log records the order of picks and bans, not when each was made or how much reserve time was used
  - measure: public matchmaking
    aliases: [pubs, pub games, public matches, ranked matchmaking, pub bans, pub drafts, bans in public matchmaking, turbo]
    route_to: pub_meta
    reason: only professional matches have drafts and bans here; public games carry no draft, and pub hero stats are answered separately
  - measure: personal match history
    aliases: [my matches, my win rate, my account, my games, my drafts, steam id, steam account, account id, dotabuff profile]
    reason: only professional matches are here, not any individual player's public history
  - measure: tier-3 leagues
    aliases: [tier 3, tier-3, tier three, excluded leagues, amateur leagues, Destiny League, Dota 2 Space League]
    reason: professional matches here are those in leagues OpenDota rates premium or professional; its tier-3 leagues such as Destiny League, Dota 2 Space League and Ultras Dota Pro League 2025-26 are left out of every answer
access:
  allow:
    - {group: demo}
    - {group: everyone}
rate_limit:
  per_caller_rpm: 60
  per_caller_rpd: 50

eval_gate: block

# Typed first; a question that does not type falls to raw SQL, disclosed UNTYPED.
untyped_fallback: true
