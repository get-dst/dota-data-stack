# Certified answers: question -> SQL pairs a person checked. Served verbatim, re-verified
# on every apply and by `dst test`. Start small; promote from the review queue.
- question: How many pro matches were played on the current patch?
  sql: |
    SELECT COUNT(*) AS match_count
    FROM marts.fact_match AS pro_matches
    JOIN marts.dim_patch AS patches ON patches.patch_id = pro_matches.patch_id
    WHERE patches.is_current = TRUE
  status: active
- question: What is the average pro match duration in minutes on the current patch?
  sql: |
    SELECT AVG(duration_min) AS avg_duration_min
    FROM marts.fact_match AS pro_matches
    JOIN marts.dim_patch AS patches ON patches.patch_id = pro_matches.patch_id
    WHERE patches.is_current = TRUE
  status: active
- question: What is the current patch?
  sql: |
    SELECT patch_name
    FROM marts.dim_patch AS patches
    WHERE patches.is_current = TRUE
  status: active
