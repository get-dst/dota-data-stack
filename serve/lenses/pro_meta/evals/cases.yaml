# Behavioral expectations. MMR must refuse; the questions a reader relies on must answer.
- question: What is the average MMR of players in pro matches?
  expect: refuse
  status: approved
- question: How much prize money did the winning team earn?
  expect: refuse
  status: approved
- question: How many pro matches were played on the current patch?
  expect: answer
  status: approved
- question: Which hero was banned most on the current patch?
  expect: answer
  status: approved
- question: Which team has the highest win rate?
  expect: answer
  status: approved
# Team questions live on team_matches, two rows per match; the player grain counted a
# team's matches five times.
- question: How many matches did Team Liquid play in August 2026?
  expect: answer
  status: approved
- question: How did Team Spirit do on the current patch?
  expect: answer
  status: approved
- question: How did Team Liquid do in September compared to August?
  expect: answer
  status: approved
# A hero win rate over a period is null under 20 games, so a hero with two wins in
# two games cannot top the month.
- question: Which hero has the highest win rate this month?
  expect: answer
  status: approved
- question: Who has the highest average GPM?
  expect: answer
  status: approved
# Retired: win_rate stopped being an ambiguous term once hero_win_rate and team_win_rate
# became explicit; a bare "win rate" now answers the player-grain metric.
- question: What is the win rate this patch?
  expect: clarify
  term: win_rate
  status: retired
- question: Which offlaners have the best win rate in pro matches this patch?
  expect: answer
  status: approved
- question: How has Team Spirit done against Team Liquid?
  expect: answer
  status: approved
- question: What is my win rate on Pudge?
  expect: refuse
  status: approved
- question: Which team has the best record in PGL Wallachia?
  expect: answer
  status: approved
- question: What changed for Pudge in the latest patch?
  expect: answer
  status: approved
