name: pro_meta
display_name: Dota 2 pro meta
description: Professional Dota 2 matches from OpenDota — heroes, drafts, teams, patches,
  gold leads, objectives and positions.
owner: dota-d-stack
# Match times are UTC epochs; the business day is UTC.
timezone: UTC
# The loader runs daily; two days without new matches is stale.
stale_after_days: 2
connections: [warehouse]
select:
  entities:
    - pro_matches
    - team_matches
    - player_performances
    - hero_daily_stats
    - heroes
    - patches
    - teams
    - leagues
    - team_head_to_head
    - league_standings
    - patch_notes
    - advantage_timeline
    - match_leads
    - match_objectives
    - objective_win_rates
    - hero_patch_trends
    - hero_position_meta
  definitions:
    - hero_win_rate
    - team_win_rate
    - pick_rate
    - ban_rate
    - contest_rate
    - current_patch
    - pro_match
    - position
    - minimum_games
    - comeback
    - first_objective
not_computable:
  - measure: MMR
    aliases: [rank, skill bracket, rating of players, medal]
    reason: professional matches carry no matchmaking rating; only teams have an OpenDota rating
  - measure: prize money
    aliases: [earnings, winnings, prize pool]
    reason: OpenDota's match feed carries no prize data
  - measure: personal match history
    aliases: [my matches, my win rate, my account, my games, steam id, dotabuff profile]
    reason: this lens holds professional matches, not any individual player's public history
  - measure: tier-3 leagues
    aliases: [tier 3, tier-3, tier three, excluded leagues, amateur leagues, Destiny League, Ultras Dota Pro League, Dota 2 Space League, SIVVIT League]
    reason: professional matches here are those in leagues OpenDota rates premium or professional; matches in leagues it rates excluded, its tier-3 leagues such as Destiny League, Dota 2 Space League and Ultras Dota Pro League 2025-26, stay in the raw tables and reach no table in this lens
access:
  allow:
    - {group: demo}
    - {group: everyone}
rate_limit:
  per_caller_rpm: 60
  per_caller_rpd: 50

eval_gate: block

# Typed first; a question that does not type falls to raw SQL, disclosed UNTYPED.
untyped_fallback: true
