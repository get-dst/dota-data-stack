# Hourly: pull new pro matches and the public sample into the warehouse and rebuild
# the marts. Target by secret: MOTHERDUCK_TOKEN → MotherDuck (database `dota`);
# else DATABASE_URL + PG* → Postgres; else a throwaway local DuckDB that keeps nothing.
# OPENDOTA_API_KEY pays for match details; the monthly cap below is enforced from the
# warehouse's own api_usage table, so no schedule can spend past it.
name: load
concurrency:
  group: load
  cancel-in-progress: false
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DSTACK_TARGET: ${{ secrets.MOTHERDUCK_TOKEN != '' && 'motherduck' || (secrets.DATABASE_URL != '' && 'postgres' || 'duckdb') }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      MOTHERDUCK_DATABASE: dota
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
      DOTA_SINCE_DAYS: "365"
      DOTA_MAX_DETAIL_CALLS: "300"
      DOTA_PAID_CALLS_MONTH: "90000"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: load (dlt)
        run: uv run python load/opendota_pipeline.py
      - name: transform (dbt)
        run: cd transform && ../.venv/bin/dbt build --profiles-dir .
