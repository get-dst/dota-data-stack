# On every pull request: plan the change, find the vouched questions that stand on
# it, re-verify them, and post the result on the PR.
name: verify
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  plan-and-re-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: plan, apply, re-verify
        env:
          COMMENT_PATH: ${{ runner.temp }}/comment.md
        run: python3 ci/verify_demo.py origin/${{ github.base_ref }}
      - name: Post the result on the PR
        uses: actions/github-script@v7
        env:
          COMMENT_PATH: ${{ runner.temp }}/comment.md
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
