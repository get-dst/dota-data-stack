<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="960" height="300" rx="10" fill="#f7f4ec"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b3b36"/>
    </marker>
  </defs>

  <!-- source -->
  <rect x="20" y="95" width="130" height="90" rx="6" fill="#fff" stroke="#3b3b36"/>
  <text x="85" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#1f1f1c">OpenDota</text>
  <text x="85" y="150" text-anchor="middle" font-size="11" fill="#55554e">pro matches</text>
  <text x="85" y="165" text-anchor="middle" font-size="11" fill="#55554e">public sample</text>

  <!-- dlt -->
  <rect x="185" y="95" width="130" height="90" rx="6" fill="#fff" stroke="#3b3b36"/>
  <text x="250" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1f1c">dlt</text>
  <text x="250" y="146" text-anchor="middle" font-size="11" fill="#55554e">load, hourly</text>
  <text x="250" y="161" text-anchor="middle" font-size="11" fill="#55554e">paid-call cap</text>
  <text x="250" y="176" text-anchor="middle" font-size="11" fill="#55554e">GitHub Actions</text>

  <!-- MotherDuck with dbt inside -->
  <rect x="350" y="40" width="270" height="200" rx="8" fill="#fff" stroke="#3b3b36" stroke-dasharray="5 4"/>
  <text x="485" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#1f1f1c">MotherDuck · md:dota</text>
  <rect x="368" y="110" width="70" height="60" rx="5" fill="#efece2" stroke="#8a877c"/>
  <text x="403" y="145" text-anchor="middle" font-size="12" fill="#1f1f1c">raw</text>
  <rect x="455" y="110" width="60" height="60" rx="5" fill="#206b4e"/>
  <text x="485" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">dbt</text>
  <text x="485" y="155" text-anchor="middle" font-size="10" fill="#e3efe9">tests</text>
  <rect x="532" y="110" width="70" height="60" rx="5" fill="#efece2" stroke="#8a877c"/>
  <text x="567" y="137" text-anchor="middle" font-size="12" fill="#1f1f1c">marts</text>
  <text x="567" y="153" text-anchor="middle" font-size="10" fill="#55554e">documented</text>
  <text x="485" y="205" text-anchor="middle" font-size="11" fill="#55554e">one database: raw + marts</text>
  <text x="485" y="221" text-anchor="middle" font-size="11" fill="#55554e">descriptions as column comments</text>
  <line x1="438" y1="140" x2="453" y2="140" stroke="#3b3b36" marker-end="url(#a)"/>
  <line x1="515" y1="140" x2="530" y2="140" stroke="#3b3b36" marker-end="url(#a)"/>

  <!-- dst -->
  <rect x="655" y="75" width="140" height="130" rx="6" fill="#fff" stroke="#206b4e" stroke-width="2"/>
  <text x="725" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#206b4e">dst</text>
  <text x="725" y="124" text-anchor="middle" font-size="11" fill="#55554e">semantic layer</text>
  <text x="725" y="139" text-anchor="middle" font-size="11" fill="#55554e">5 lenses</text>
  <text x="725" y="154" text-anchor="middle" font-size="11" fill="#55554e">typed serving</text>
  <text x="725" y="169" text-anchor="middle" font-size="11" fill="#55554e">refusals by name</text>
  <text x="725" y="184" text-anchor="middle" font-size="11" fill="#55554e">tests on every PR</text>

  <!-- consumer -->
  <rect x="830" y="95" width="110" height="90" rx="6" fill="#fff" stroke="#3b3b36"/>
  <text x="885" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1f1f1c">your AI</text>
  <text x="885" y="148" text-anchor="middle" font-size="11" fill="#55554e">MCP · API</text>
  <text x="885" y="163" text-anchor="middle" font-size="11" fill="#55554e">answer + SQL</text>
  <text x="885" y="178" text-anchor="middle" font-size="11" fill="#55554e">+ receipt</text>

  <line x1="150" y1="140" x2="182" y2="140" stroke="#3b3b36" marker-end="url(#a)"/>
  <line x1="315" y1="140" x2="365" y2="140" stroke="#3b3b36" marker-end="url(#a)"/>
  <line x1="602" y1="140" x2="652" y2="140" stroke="#3b3b36" marker-end="url(#a)"/>
  <line x1="795" y1="140" x2="827" y2="140" stroke="#3b3b36" marker-end="url(#a)"/>

  <text x="480" y="283" text-anchor="middle" font-size="11" fill="#8a877c">load → transform → serve · each tool does one job</text>
</svg>
